codeExample:'<span class="kw">&lt;?php</span><br><span class="var"></span> <span class="kw">=</span> <span class="str">"SELECT u.name, p.title, p.created_at</span><br><span class="str">FROM users u</span><br><span class="str">INNER JOIN posts p ON u.id = p.user_id</span><br><span class="str">WHERE u.active = 1</span><br><span class="str">ORDER BY p.created_at DESC"</span>;<br><span class="var"></span> <span class="kw">=</span> <span class="var"></span><span class="kw">-&gt;</span><span class="fn">query</span>(<span class="var"></span>)<span class="kw">-&gt;</span><span class="fn">fetchAll</span>(PDO::FETCH_ASSOC);<br><span class="cmt">// Many-to-many: users &lt;-&gt; user_roles &lt;-&gt; roles</span><br><span class="var"></span> <span class="kw">=</span> <span class="str">"SELECT r.name FROM users u</span><br><span class="str">INNER JOIN user_roles ur ON u.id = ur.user_id</span><br><span class="str">INNER JOIN roles r ON ur.role_id = r.id</span><br><span class="str">WHERE u.id = ?"</span>;<br><span class="kw">?&gt;</span>',
useCases:["User with their orders","Posts with author info","Products with categories","Many-to-many: students-courses"],
mistakes:["Forgetting JOIN condition (Cartesian product)","N+1 query problem in loops","Not indexing foreign key columns","Using LEFT JOIN when INNER JOIN suffices"],
tips:["Index foreign key columns","Use EXPLAIN to analyze query performance","Eager load relations to avoid N+1","Use aliases: u, p, o for readability"],
interview:["INNER JOIN vs LEFT JOIN difference?","What is the N+1 problem?","How to implement many-to-many in MySQL?"]}
]},
{id:17,title:"Security Best Practices",icon:"🔒",color:"#dc2626",description:"Secure PHP apps against common vulnerabilities",subtopics:[
{name:"Input Validation & Sanitization",brief:"Validate and sanitize all user input before use",explanation:"Never trust user input. Validate (check format) and sanitize (remove harmful content). Use ilter_var() with FILTER_VALIDATE_* and FILTER_SANITIZE_* flags. htmlspecialchars() prevents XSS. strip_tags() removes HTML. Use ctype_* functions for simple checks. Whitelist validation is safer than blacklist.",
syntax:'<span class="var"></span> <span class="kw">=</span> <span class="kw">filter_var</span>(<span class="var"></span>[<span class="str">"email"</span>], FILTER_VALIDATE_EMAIL);<br><span class="var"></span> <span class="kw">=</span> <span class="kw">htmlspecialchars</span>(<span class="var"></span>, ENT_QUOTES, <span class="str">"UTF-8"</span>);<br><span class="kw">filter_input</span>(INPUT_GET, <span class="str">"id"</span>, FILTER_VALIDATE_INT);',
codeExample:'<span class="kw">&lt;?php</span><br><span class="var"></span> <span class="kw">=</span> <span class="kw">trim</span>(<span class="var"></span>[<span class="str">"name"</span>] <span class="kw">??</span> <span class="str">""</span>);<br><span class="kw">if</span> (<span class="kw">strlen</span>(<span class="var"></span>) <span class="kw">&gt;</span> <span class="num">100</span>) { <span class="cmt">/* reject */</span> }<br><span class="var"></span> <span class="kw">=</span> <span class="kw">filter_var</span>(<span class="var"></span>[<span class="str">"email"</span>], FILTER_VALIDATE_EMAIL);<br><span class="kw">if</span> (<span class="var"></span> <span class="kw">===</span> <span class="kw">false</span>) { <span class="kw">echo</span> <span class="str">"Invalid email"</span>; }<br><span class="cmt">// Output escaping</span><br><span class="kw">echo</span> <span class="kw">htmlspecialchars</span>(<span class="var"></span>, ENT_QUOTES, <span class="str">"UTF-8"</span>);<br><span class="kw">?&gt;</span>',
useCases:["All forms and URL handlers","Database input (prevent injection)","Displaying user content (prevent XSS)","File upload validation"],
mistakes:["Only client-side validation","Using filter_var on wrong type","Forgetting to set encoding in htmlspecialchars","Blacklist filtering (incomplete)"],
tips:["Filter on input, escape on output","Use type hints and declare_strict_types","Whitelist allowed characters/values","Use password_hash() not custom hashing"],
interview:["Difference between validation and sanitization?","What is the best way to prevent XSS?","How does filter_var work?"]},
{name:"Password & CSRF Protection",brief:"Securely hash passwords and prevent cross-site request forgery",explanation:"Password hashing: password_hash() with PASSWORD_BCRYPT or PASSWORD_ARGON2ID (PHP 8+). password_verify() checks against hash. Never use md5/sha1. CSRF: generate a token, store in session, include in forms, verify on submission. SameSite=Strict cookies help. Consider using CSP headers and HSTS.",
syntax:'<span class="var"></span> <span class="kw">=</span> <span class="kw">password_hash</span>(<span class="var"></span>, PASSWORD_BCRYPT);<br><span class="kw">if</span> (<span class="kw">password_verify</span>(<span class="var"></span>, <span class="var"></span>)) { <span class="cmt">/* login */</span> }<br><span class="cmt">// CSRF token</span><br><span class="var"></span>[<span class="str">"csrf"</span>] <span class="kw">=</span> <span class="kw">bin2hex</span>(<span class="kw">random_bytes</span>(<span class="num">32</span>));',
codeExample:'<span class="kw">&lt;?php</span><br><span class="cmt">// Register</span><br><span class="var"></span> <span class="kw">=</span> <span class="kw">password_hash</span>(<span class="var"></span>[<span class="str">"password"</span>], PASSWORD_ARGON2ID);<br><span class="cmt">// Login</span><br><span class="kw">if</span> (<span class="kw">password_verify</span>(<span class="var"></span>, <span class="var"></span>)) {<br>&nbsp;&nbsp;<span class="cmt">// success, regenerate session</span><br>&nbsp;&nbsp;<span class="kw">session_regenerate_id</span>(<span class="kw">true</span>);<br>}<br><span class="cmt">// CSRF protection</span><br><span class="kw">session_start</span>();<br><span class="kw">if</span> (<span class="kw">empty</span>(<span class="var"></span>[<span class="str">"csrf"</span>])) {<br>&nbsp;&nbsp;<span class="var"></span>[<span class="str">"csrf"</span>] <span class="kw">=</span> <span class="kw">bin2hex</span>(<span class="kw">random_bytes</span>(<span class="num">32</span>));<br>}<br><span class="cmt">// In form: &lt;input type="hidden" name="csrf" value="&lt;?=['csrf']?&gt;"&gt;</span><br><span class="cmt">// Verify: hash_equals(['csrf'], ['csrf'])</span><br><span class="kw">?&gt;</span>',
useCases:["User registration and login","Password reset flows","Payment forms","Account settings changes"],
mistakes:["Using md5()/sha1() for passwords","Not regenerating session after login","Comparing CSRF tokens with == (timing attack)","Storing CSRF token in cookie"],
tips:["Use Argon2id if available (PHP 8+)","Use hash_equals() for token comparison","Rate limit login attempts","Use password_needs_rehash() for upgrading"],
interview:["How does password_hash work?","What is CSRF and how to prevent it?","Why use hash_equals instead of ==?"]},
{name:"SQL Injection Prevention",brief:"Use prepared statements to prevent SQL injection",explanation:"SQL injection occurs when user input is concatenated into SQL queries. Prevention: always use prepared statements (PDO or MySQLi) with placeholders. Never interpolate variables directly. Escape with PDO::quote() only as fallback. Use whitelisting for dynamic table/column names (cannot be parameterized). Least privilege for DB users.",
syntax:'<span class="cmt">// UNSAFE - never do this:</span><br><span class="var"></span> <span class="kw">=</span> <span class="str">"SELECT * FROM users WHERE id = "</span> <span class="kw">.</span> <span class="var"></span>[<span class="str">"id"</span>];<br><span class="cmt">// SAFE - prepared statement:</span><br><span class="var"></span> <span class="kw">=</span> <span class="var"></span><span class="kw">-&gt;</span><span class="fn">prepare</span>(<span class="str">"SELECT * FROM users WHERE id = ?"</span>);<br><span class="var"></span><span class="kw">-&gt;</span><span class="fn">execute</span>([<span class="var"></span>[<span class="str">"id"</span>]]);',
codeExample:'<span class="kw">&lt;?php</span><br><span class="cmt">// SAFE: Positional placeholders</span><br><span class="var"></span> <span class="kw">=</span> <span class="var"></span><span class="kw">-&gt;</span><span class="fn">prepare</span>(<span class="str">"SELECT * FROM products WHERE category = ? AND price &lt; ?"</span>);<br><span class="var"></span><span class="kw">-&gt;</span><span class="fn">execute</span>([<span class="var"></span>, <span class="var"></span>]);<br><span class="cmt">// SAFE: Named placeholders</span><br><span class="var"></span> <span class="kw">=</span> <span class="var"></span><span class="kw">-&gt;</span><span class="fn">prepare</span>(<span class="str">"UPDATE users SET name = :name WHERE id = :id"</span>);<br><span class="var"></span><span class="kw">-&gt;</span><span class="fn">execute</span>([<span class="str">"name"</span> <span class="kw">=&gt;</span> <span class="var"></span>, <span class="str">"id"</span> <span class="kw">=&gt;</span> <span class="var"></span>]);<br><span class="kw">?&gt;</span>',
useCases:["All database queries with user-supplied values","Search/filter functionality","Dynamic where clauses","Bulk insert/update operations"],
mistakes:["Escaping quotes instead of using prepared statements","Using query() with interpolated SQL","Trusting stored procedure input","Dynamic table names without whitelist"],
tips:["PDO: set ERRMODE_EXCEPTION to catch SQL errors","Never trust intval() as SQL injection prevention","Use LIMIT in queries to reduce blast radius","Audit SQL with EXPLAIN"],
interview:["How do prepared statements prevent SQL injection?","Can you parameterize table names?","What is second-order SQL injection?"]}
]},
{id:18,title:"Composer & Dependency Management",icon:"📦",color:"#84cc16",description:"Manage PHP packages and autoloading with Composer",subtopics:[
{name:"Composer Basics",brief:"Initialize, install, and manage packages with composer.json",explanation:"Composer is a dependency manager for PHP. composer init creates composer.json. composer require package/name adds a dependency. composer install installs from composer.lock (use in production). composer update updates to latest versions. Version constraints: ^1.0 (1.x), ~1.0 (1.0.x), 1.*. composer.lock locks exact versions. Private packages via repositories config.",
syntax:'<span class="cmt">// composer.json</span><br>{<br>&nbsp;&nbsp;<span class="str">"require"</span>: {<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="str">"monolog/monolog"</span>: <span class="str">"^2.0"</span><br>&nbsp;&nbsp;},<br>&nbsp;&nbsp;<span class="str">"autoload"</span>: {<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="str">"psr-4"</span>: { <span class="str">"App\\\\"</span>: <span class="str">"src/"</span> }<br>&nbsp;&nbsp;}<br>}',
codeExample:'<span class="cmt"># Install Composer (Windows)</span><br><span class="cmt"># Download from getcomposer.org or use:</span><br><span class="cmt"># php -r "copy(\"https://getcomposer.org/installer\", \"composer-setup.php\");"</span><br><span class="cmt"># php composer-setup.php</span><br><span class="cmt"># Initialize project</span><br><span class="cmt"># composer init</span><br><span class="cmt"># Require a package</span><br><span class="cmt"># composer require guzzlehttp/guzzle</span><br><span class="cmt"># Install from lock file (production)</span><br><span class="cmt"># composer install --no-dev --optimize-autoloader</span><br><span class="kw">&lt;?php</span><br><span class="kw">require_once</span> __DIR__ <span class="kw">.</span> <span class="str">"/vendor/autoload.php"</span>;<br><span class="kw">use</span> <span class="cn">Monolog</span>\\<span class="cn">Logger</span>;<br><span class="var"></span> <span class="kw">=</span> <span class="kw">new</span> <span class="cn">Logger</span>(<span class="str">"app"</span>);<br><span class="kw">?&gt;</span>',
useCases:["Installing frameworks (Laravel, Symfony)","Adding logging, HTTP clients, mailers","Static analysis and testing tools","Autoloading your own classes"],
mistakes:["Committing vendor directory","Not using composer.lock in production","Forgetting --no-dev for production deploy","Not running composer dump-autoload after adding classes"],
tips:["Use ^ for compatible version updates","Use --prefer-dist for faster installs","Use COMPOSER_MEMORY_LIMIT=-1 for large projects","Run composer audit for security"],
interview:["What is the difference between composer install and update?","What is the purpose of composer.lock?","How does PSR-4 autoloading work in Composer?"]},
{name:"Packages & Versioning",brief:"Semantic versioning, require, require-dev, scripts",explanation:"Composer distinguishes equire (production deps) and equire-dev (development only, e.g., PHPUnit, PHPStan). Semantic versioning: MAJOR.MINOR.PATCH (2.1.5). ^2.0 means >=2.0 <3.0. ~2.1 means >=2.1 <2.2. Scripts: post-install-cmd, post-update-cmd, etc. Repositories: Packagist (default), private VCS, artifact (zip files).",
syntax:'<span class="str">"require-dev"</span>: {<br>&nbsp;&nbsp;<span class="str">"phpunit/phpunit"</span>: <span class="str">"^10.0"</span><br>},<br><span class="str">"scripts"</span>: {<br>&nbsp;&nbsp;<span class="str">"post-install-cmd"</span>: [<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="str">"@php artisan clear-compiled"</span><br>&nbsp;&nbsp;]<br>}',
codeExample:'<span class="cmt"># Install dev dependency</span><br><span class="cmt"># composer require --dev phpstan/phpstan</span><br><span class="cmt"># Run scripts defined in composer.json</span><br><span class="cmt"># composer run-script tests</span><br><span class="cmt"># Show installed packages</span><br><span class="cmt"># composer show</span><br><span class="cmt"># Check for outdated packages</span><br><span class="cmt"># composer outdated</span><br><span class="cmt"># Security audit</span><br><span class="cmt"># composer audit</span><br><span class="cmt"># Create new project from package</span><br><span class="cmt"># composer create-project laravel/laravel my-app</span>',
useCases:["Separating dev tools from production","Automating build tasks with scripts","Creating reusable PHP packages","Managing monorepo projects"],
mistakes:["Installing dev dependencies in production","Not pinning versions in production","Removing vendor folder for updates","Incorrect version constraint causing incompatible deps"],
tips:["Use --no-dev on CI and production","Lockfile: commit to VCS ","Use composer why/why-not to debug deps","Use --profile for performance debugging"],
interview:["What is the difference between require and require-dev?","How does semantic versioning work in Composer?","What are Composer scripts?"]}
]},
{id:19,title:"MVC Architecture",icon:"🏗️",color:"#7c3aed",description:"Structure PHP apps with Model-View-Controller pattern",subtopics:[
{name:"MVC Pattern",brief:"Separate business logic, presentation, and routing",explanation:"MVC divides code into three layers: Model (data/business logic), View (presentation/UI), Controller (request handling). Models communicate with database, Views render HTML/PHP templates, Controllers handle HTTP requests and coordinate. Controllers call Models, inject data into Views. Router maps URLs to Controller methods.",
syntax:'<span class="cmt">// Route: /users</span><br><span class="var"></span><span class="kw">-&gt;</span><span class="fn">get</span>(<span class="str">"/users"</span>, [<span class="cn">UserController</span>::<span class="kw">class</span>, <span class="str">"index"</span>]);<br><span class="cmt">// Controller</span><br><span class="kw">class</span> <span class="cn">UserController</span> {<br>&nbsp;&nbsp;<span class="kw">public</span> <span class="kw">function</span> <span class="fn">index</span>() {<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="var"></span> <span class="kw">=</span> <span class="cn">User</span>::<span class="fn">all</span>(); <span class="cmt">// Model</span><br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> <span class="fn">view</span>(<span class="str">"users"</span>, [<span class="str">"users"</span> <span class="kw">=&gt;</span> <span class="var"></span>]); <span class="cmt">// View</span><br>&nbsp;&nbsp;}<br>}',
codeExample:'<span class="kw">&lt;?php</span><br><span class="cmt">// Simple MVC routing</span><br><span class="var"></span> <span class="kw">=</span> <span class="kw">parse_url</span>(<span class="var"></span>[<span class="str">"REQUEST_URI"</span>], PHP_URL_PATH);<br><span class="kw">if</span> (<span class="var"></span> <span class="kw">===</span> <span class="str">"/users"</span> <span class="kw">&amp;&amp;</span> <span class="var"></span>[<span class="str">"REQUEST_METHOD"</span>] <span class="kw">===</span> <span class="str">"GET"</span>) {<br>&nbsp;&nbsp;<span class="var"></span> <span class="kw">=</span> <span class="kw">new</span> <span class="cn">UserController</span>(<span class="var"></span>);<br>&nbsp;&nbsp;<span class="var"></span><span class="kw">-&gt;</span><span class="fn">index</span>();<br>}<br><span class="cmt">// Model (simplified)</span><br><span class="kw">class</span> <span class="cn">User</span> {<br>&nbsp;&nbsp;<span class="kw">static</span> <span class="kw">function</span> <span class="fn">all</span>() {<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">global</span> <span class="var"></span>;<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> <span class="var"></span><span class="kw">-&gt;</span><span class="fn">query</span>(<span class="str">"SELECT * FROM users"</span>)<span class="kw">-&gt;</span><span class="fn">fetchAll</span>();<br>&nbsp;&nbsp;}<br>}<br><span class="kw">?&gt;</span>',
useCases:["All major PHP frameworks","Structuring large web apps","Separating frontend and backend concerns","Team development (frontend/backend)"],
mistakes:["Fat controllers (too much logic in controller)","Fat models (everything in model)","View containing business logic","Not using service layer for complex logic"],
tips:["Keep controllers thin (10-20 lines per method)","Use Service/Repository pattern for complex apps","Use dependency injection for loose coupling","Frameworks: Laravel, Symfony, CodeIgniter"],
interview:["Explain MVC pattern components","What is a fat controller problem?","How does routing work in MVC?"]},
{name:"Routing & Front Controller",brief:"Route URLs to controllers via a front controller pattern",explanation:"The Front Controller pattern routes all requests through a single entry point (index.php). Apache/Nginx rewrite rules direct to it. The router parses the URL, matches against defined routes, extracts parameters, and dispatches to the appropriate controller method. Supports RESTful routing, middleware, route groups, and named routes.",
syntax:'<span class="cmt">// .htaccess (Apache rewrite)</span><br><span class="kw">RewriteEngine On</span><br><span class="kw">RewriteCond</span> %{REQUEST_FILENAME} !-f<br><span class="kw">RewriteRule</span> ^(.*)$ index.php [QSA,L]<br><span class="cmt">// index.php (front controller)</span><br><span class="kw">require_once</span> <span class="str">"vendor/autoload.php"</span>;<br><span class="var"></span><span class="kw">-&gt;</span><span class="fn">dispatch</span>(<span class="var"></span>[<span class="str">"REQUEST_URI"</span>]);',
codeExample:'<span class="kw">&lt;?php</span><br><span class="cmt">// Simple router implementation</span><br><span class="var"></span> <span class="kw">=</span> [<br>&nbsp;&nbsp;<span class="str">"GET"</span> <span class="kw">=&gt;</span> [<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="str">"/"</span> <span class="kw">=&gt;</span> [<span class="cn">HomeController</span>::<span class="kw">class</span>, <span class="str">"index"</span>],<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="str">"/users/{id}"</span> <span class="kw">=&gt;</span> [<span class="cn">UserController</span>::<span class="kw">class</span>, <span class="str">"show"</span>],<br>&nbsp;&nbsp;]<br>];<br><span class="cmt">// Parse route with regex</span><br><span class="kw">foreach</span> (<span class="var"></span>[<span class="var"></span>[<span class="str">"REQUEST_METHOD"</span>]] <span class="kw">as</span> <span class="var"></span> <span class="kw">=&gt;</span> <span class="var"></span>) {<br>&nbsp;&nbsp;<span class="var"></span> <span class="kw">=</span> <span class="kw">preg_replace</span>(<span class="str">"/\\{(\\w+)\\}/"</span>, <span class="str">"(?P&lt;&gt;[^/]+)"</span>, <span class="var"></span>);<br>&nbsp;&nbsp;<span class="kw">if</span> (<span class="kw">preg_match</span>(<span class="str">"#^</span><span class="var"></span><span class="str">$#"</span>, <span class="var"></span>, <span class="var"></span>)) {<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">echo</span> (<span class="kw">new</span> <span class="var"></span>[<span class="num">0</span>])<span class="kw">-&gt;</span><span class="fn">{[1]}</span>(...<span class="kw">array_filter</span>(<span class="var"></span>, <span class="str">"is_string"</span>, ARRAY_FILTER_USE_KEY));<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span>;<br>&nbsp;&nbsp;}<br>}<br><span class="kw">?&gt;</span>',
useCases:["Frameworks: Laravel, Symfony, Slim","RESTful API routing","Middleware pipeline (auth, logging)","Route groups for admin/api prefix"],
mistakes:["Not using a router (PHP files as pages)","Over-nesting route groups","Not handling 404 properly","No CSRF on POST routes"],
tips:["Use route name generation (route("user.show", ))","Group routes by middleware","Cache routes in production","Use route model binding"],
interview:["What is a Front Controller?","How does URL rewriting work?","What is route model binding?"]}
]},
{id:20,title:"APIs & JSON",icon:"🌐",color:"#0ea5e9",description:"Build and consume RESTful APIs with JSON",subtopics:[
{name:"JSON Handling",brief:"Encode/decode JSON with json_encode/json_decode",explanation:"json_encode() converts PHP arrays/objects to JSON string. json_decode(, true) converts JSON to PHP array (assoc=true) or stdClass objects (assoc=false). Options: JSON_PRETTY_PRINT, JSON_UNESCAPED_UNICODE, JSON_THROW_ON_ERROR (PHP 7.3+). json_last_error() for error checking. JSON is the primary data format for modern APIs.",
syntax:'<span class="var"></span> <span class="kw">=</span> [<span class="str">"name"</span> <span class="kw">=&gt;</span> <span class="str">"John"</span>, <span class="str">"age"</span> <span class="kw">=&gt;</span> <span class="num">30</span>];<br><span class="var"></span> <span class="kw">=</span> <span class="kw">json_encode</span>(<span class="var"></span>, JSON_PRETTY_PRINT | JSON_THROW_ON_ERROR);<br><span class="var"></span> <span class="kw">=</span> <span class="kw">json_decode</span>(<span class="var"></span>, <span class="kw">true</span>);',
codeExample:'<span class="kw">&lt;?php</span><br><span class="cmt">// API response</span><br><span class="var"></span> <span class="kw">=</span> [<br>&nbsp;&nbsp;<span class="str">"status"</span> <span class="kw">=&gt;</span> <span class="str">"success"</span>,<br>&nbsp;&nbsp;<span class="str">"data"</span> <span class="kw">=&gt;</span> [<br>&nbsp;&nbsp;&nbsp;&nbsp;[<span class="str">"id"</span> <span class="kw">=&gt;</span> <span class="num">1</span>, <span class="str">"title"</span> <span class="kw">=&gt;</span> <span class="str">"Post 1"</span>],<br>&nbsp;&nbsp;&nbsp;&nbsp;[<span class="str">"id"</span> <span class="kw">=&gt;</span> <span class="num">2</span>, <span class="str">"title"</span> <span class="kw">=&gt;</span> <span class="str">"Post 2"</span>]<br>&nbsp;&nbsp;]<br>];<br><span class="kw">header</span>(<span class="str">"Content-Type: application/json"</span>);<br><span class="kw">http_response_code</span>(<span class="num">200</span>);<br><span class="kw">echo</span> <span class="kw">json_encode</span>(<span class="var"></span>, JSON_THROW_ON_ERROR);<br><span class="kw">?&gt;</span>',
useCases:["REST API responses","Reading config files","Storing structured data","Frontend-backend data exchange"],
mistakes:["Not setting Content-Type header","Decoding without checking json_last_error","Large payload memory issues","Not handling deep-nested structures safely"],
tips:["Use JSON_THROW_ON_ERROR for exception handling","json_decode(, true) for associative arrays","Use JSON_UNESCAPED_UNICODE for Unicode","json_encode with JSON_PRETTY_PRINT for debugging"],
interview:["What does json_decode return by default?","How to handle JSON parse errors?","What does JSON_THROW_ON_ERROR do?"]},
{name:"Building REST APIs",brief:"Create RESTful endpoints with proper HTTP methods/status codes",explanation:"REST APIs use HTTP methods: GET (read), POST (create), PUT/PATCH (update), DELETE (delete). Common status codes: 200 OK, 201 Created, 400 Bad Request, 401 Unauthorized, 403 Forbidden, 404 Not Found, 422 Validation Error, 500 Server Error. Accept/parse JSON input with php://input + json_decode. Return proper Content-Type: application/json and CORS headers.",
syntax:'<span class="kw">header</span>(<span class="str">"Content-Type: application/json"</span>);<br><span class="kw">header</span>(<span class="str">"Access-Control-Allow-Origin: *"</span>);<br><span class="var"></span> <span class="kw">=</span> <span class="kw">json_decode</span>(<span class="kw">file_get_contents</span>(<span class="str">"php://input"</span>), <span class="kw">true</span>);<br><span class="kw">http_response_code</span>(<span class="num">201</span>);<br><span class="kw">echo</span> <span class="kw">json_encode</span>([<span class="str">"message"</span> <span class="kw">=&gt;</span> <span class="str">"Created"</span>]);',
codeExample:'<span class="kw">&lt;?php</span><br><span class="kw">header</span>(<span class="str">"Content-Type: application/json"</span>);<br><span class="kw">header</span>(<span class="str">"Access-Control-Allow-Methods: GET, POST, PUT, DELETE"</span>);<br><span class="var"></span> <span class="kw">=</span> <span class="var"></span>[<span class="str">"REQUEST_METHOD"</span>];<br><span class="var"></span> <span class="kw">=</span> <span class="kw">parse_url</span>(<span class="var"></span>[<span class="str">"REQUEST_URI"</span>], PHP_URL_PATH);<br><span class="kw">match</span> ([<span class="var"></span>, <span class="var"></span>]) {<br>&nbsp;&nbsp;[<span class="str">"GET"</span>, <span class="str">"/api/users"</span>] <span class="kw">=&gt;</span> <span class="cmt">/* list users */</span>,<br>&nbsp;&nbsp;[<span class="str">"POST"</span>, <span class="str">"/api/users"</span>] <span class="kw">=&gt;</span> <span class="cmt">/* create user */</span>,<br>&nbsp;&nbsp;[<span class="str">"GET"</span>, <span class="str">"/api/users/1"</span>] <span class="kw">=&gt;</span> <span class="cmt">/* show user */</span>,<br>&nbsp;&nbsp;<span class="kw">default</span> <span class="kw">=&gt;</span> <span class="fn">http_response_code</span>(<span class="num">404</span>)<br>};<br><span class="kw">?&gt;</span>',
useCases:["Backend for SPA/React/Vue apps","Mobile app backends","Third-party API integrations","Microservices communication"],
mistakes:["Not validating HTTP methods","Hardcoding CORS origin incorrectly","Returning HTML error pages","Not rate-limiting API endpoints"],
tips:["Use specific HTTP status codes","Version your API (v1, v2)","Document with OpenAPI/Swagger","Use JWT or token-based auth"],
interview:["What are HTTP methods in REST?","What is the difference between PUT and PATCH?","How do you handle CORS in PHP?"]},
{name:"cURL & HTTP Clients",brief:"Make HTTP requests with cURL and Guzzle",explanation:"cURL is a PHP extension for making HTTP requests. curl_init(), curl_setopt(), curl_exec(), curl_close(). Guzzle is a popular PHP HTTP client library with a simpler interface: $client->get(), $client->post(), async support, middleware. Both support headers, POST data, file uploads, cookies, SSL, and proxies.",
syntax:'<span class="cmt">// cURL</span><br><span class="var"></span> <span class="kw">=</span> <span class="kw">curl_init</span>(<span class="str">"https://api.example.com"</span>);<br><span class="kw">curl_setopt</span>(<span class="var"></span>, CURLOPT_RETURNTRANSFER, <span class="kw">true</span>);<br><span class="var"></span> <span class="kw">=</span> <span class="kw">curl_exec</span>(<span class="var"></span>);<br><span class="kw">curl_close</span>(<span class="var"></span>);<br><span class="cmt">// Guzzle</span><br><span class="var"></span> <span class="kw">=</span> <span class="kw">new</span> <span class="cn">GuzzleHttp</span>\\<span class="cn">Client</span>();<br><span class="var"></span> <span class="kw">=</span> <span class="var"></span><span class="kw">-&gt;</span><span class="fn">get</span>(<span class="str">"https://api.example.com"</span>);',
codeExample:'<span class="kw">&lt;?php</span><br><span class="cmt">// cURL POST request</span><br><span class="var"></span> <span class="kw">=</span> <span class="kw">json_encode</span>([<span class="str">"title"</span> <span class="kw">=&gt;</span> <span class="str">"Foo"</span>, <span class="str">"body"</span> <span class="kw">=&gt;</span> <span class="str">"Bar"</span>]);<br><span class="var"></span> <span class="kw">=</span> <span class="kw">curl_init</span>(<span class="str">"https://jsonplaceholder.typicode.com/posts"</span>);<br><span class="kw">curl_setopt_array</span>(<span class="var"></span>, [<br>&nbsp;&nbsp;CURLOPT_POST <span class="kw">=&gt;</span> <span class="kw">true</span>,<br>&nbsp;&nbsp;CURLOPT_POSTFIELDS <span class="kw">=&gt;</span> <span class="var"></span>,<br>&nbsp;&nbsp;CURLOPT_HTTPHEADER <span class="kw">=&gt;</span> [<span class="str">"Content-Type: application/json"</span>],<br>&nbsp;&nbsp;CURLOPT_RETURNTRANSFER <span class="kw">=&gt;</span> <span class="kw">true</span>,<br>]);<br><span class="var"></span> <span class="kw">=</span> <span class="kw">curl_exec</span>(<span class="var"></span>);<br><span class="kw">if</span> (<span class="var"></span> <span class="kw">===</span> <span class="kw">false</span>) {<br>&nbsp;&nbsp;<span class="kw">echo</span> <span class="str">"cURL Error: "</span> <span class="kw">.</span> <span class="kw">curl_error</span>(<span class="var"></span>);<br>}<br><span class="kw">curl_close</span>(<span class="var"></span>);<br><span class="kw">?&gt;</span>',
useCases:["Calling third-party APIs","Integrating payment gateways","Social media API integration","Web scraping and data fetching"],
mistakes:["Not checking curl_error for failures","Setting incorrect Content-Type","Not following redirects (CURLOPT_FOLLOWLOCATION)","Not verifying SSL certificates (CURLOPT_SSL_VERIFYPEER)"],
tips:["Use Guzzle for cleaner HTTP code","Use curl_multi for concurrent requests","Set timeouts: CURLOPT_TIMEOUT, CURLOPT_CONNECTTIMEOUT","Use CURLOPT_CAINFO for custom CA bundle"],
interview:["How to make a POST request with cURL?","What is the advantage of Guzzle over cURL?","How to handle HTTP errors with Guzzle?"]}
]},
{id:21,title:"Projects & Best Practices",icon:"🚀",color:"#f43f5e",description:"Apply PHP skills in real projects with industry standards",subtopics:[
{name:"Project Structure",brief:"Organize PHP projects following industry standards",explanation:"A well-structured PHP project follows conventions: src/ (PHP source), public/ (web root, index.php), config/ (configuration), 	emplates/ or iews/, 	ests/, storage/ or ar/ (logs, cache), endor/ (Composer). Use .env for environment config (vlucas/phpdotenv). Separate configuration from code. Follow PSR-12 coding style.",
syntax:'<span class="cmt">my-project/</span><br><span class="cmt">├── public/</span><br><span class="cmt">│   └── index.php</span><br><span class="cmt">├── src/</span><br><span class="cmt">│   ├── Controllers/</span><br><span class="cmt">│   ├── Models/</span><br><span class="cmt">│   └── Services/</span><br><span class="cmt">├── config/</span><br><span class="cmt">├── templates/</span><br><span class="cmt">├── tests/</span><br><span class="cmt">├── storage/</span><br><span class="cmt">├── vendor/</span><br><span class="cmt">├── composer.json</span><br><span class="cmt">├── .env</span><br><span class="cmt">└── .gitignore</span>',
codeExample:'<span class="cmt">// .gitignore</span><br><span class="cmt">/vendor</span><br><span class="cmt">/.env</span><br><span class="cmt">/storage</span><br><span class="cmt">*.log</span><br><span class="cmt">// public/index.php</span><br><span class="kw">&lt;?php</span><br><span class="kw">require_once</span> __DIR__ <span class="kw">.</span> <span class="str">"/../vendor/autoload.php"</span>;<br><span class="var"></span> <span class="kw">=</span> <span class="cn">Dotenv\\Dotenv</span>::<span class="fn">createImmutable</span>(__DIR__ <span class="kw">.</span> <span class="str">"/.."</span>);<br><span class="var"></span><span class="kw">-&gt;</span><span class="fn">load</span>();<br><span class="cmt">// Bootstrap your app here</span><br><span class="kw">?&gt;</span>',
useCases:["Any PHP project larger than a single file","Team-based development","CI/CD deployment","Open source package development"],
mistakes:["Putting PHP files directly in public root","Hardcoding configuration","Not using version control (git)","Mixing business logic and presentation"],
tips:["Follow PSR-12 coding standard","Use .env for environment-specific config","Commit composer.lock to VCS","Keep public/ as the only web-accessible dir"],
interview:["What is PSR-4 and PSR-12?","Why separate public/ from src/?","What is a .env file used for?"]},
{name:"Testing (PHPUnit)",brief:"Write unit tests, feature tests with PHPUnit",explanation:"PHPUnit is the standard testing framework for PHP. Tests extend PHPUnit\Framework\TestCase. Assertions: ssertEquals, ssertTrue, ssertCount, ssertNull. setUp() runs before each test. Use @test annotation or 	est* method prefix. Data providers (@dataProvider) feed test data. Mocks/stubs with createMock(). Run with ./vendor/bin/phpunit.",
syntax:'<span class="kw">use</span> <span class="cn">PHPUnit</span>\\<span class="cn">Framework</span>\\<span class="cn">TestCase</span>;<br><span class="kw">class</span> <span class="cn">UserTest</span> <span class="kw">extends</span> <span class="cn">TestCase</span> {<br>&nbsp;&nbsp;<span class="kw">public</span> <span class="kw">function</span> <span class="fn">testUserCanBeCreated</span>() {<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="var"></span> <span class="kw">=</span> <span class="kw">new</span> <span class="cn">User</span>(<span class="str">"John"</span>);<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="var"></span><span class="kw">-&gt;</span><span class="fn">assertEquals</span>(<span class="str">"John"</span>, <span class="var"></span><span class="kw">-&gt;</span>name);<br>&nbsp;&nbsp;}<br>}',
codeExample:'<span class="kw">&lt;?php</span><br><span class="kw">use</span> <span class="cn">PHPUnit</span>\\<span class="cn">Framework</span>\\<span class="cn">TestCase</span>;<br><span class="kw">class</span> <span class="cn">CalculatorTest</span> <span class="kw">extends</span> <span class="cn">TestCase</span> {<br>&nbsp;&nbsp;<span class="kw">public</span> <span class="kw">function</span> <span class="fn">testAddition</span>() {<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="var"></span> <span class="kw">=</span> <span class="kw">new</span> <span class="cn">Calculator</span>();<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="var"></span><span class="kw">-&gt;</span><span class="fn">assertEquals</span>(<span class="num">4</span>, <span class="var"></span><span class="kw">-&gt;</span><span class="fn">add</span>(<span class="num">2</span>, <span class="num">2</span>));<br>&nbsp;&nbsp;}<br>&nbsp;&nbsp;<span class="cmt">/** @dataProvider additionProvider */</span><br>&nbsp;&nbsp;<span class="kw">public</span> <span class="kw">function</span> <span class="fn">testWithDataProvider</span>(<span class="var"></span>, <span class="var"></span>, <span class="var"></span>) {<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="var"></span><span class="kw">-&gt;</span><span class="fn">assertEquals</span>(<span class="var"></span>, (<span class="kw">new</span> <span class="cn">Calculator</span>())<span class="kw">-&gt;</span><span class="fn">add</span>(<span class="var"></span>, <span class="var"></span>));<br>&nbsp;&nbsp;}<br>&nbsp;&nbsp;<span class="kw">public</span> <span class="kw">function</span> <span class="fn">additionProvider</span>(): <span class="kw">array</span> {<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> [[<span class="num">1</span>,<span class="num">2</span>,<span class="num">3</span>], [<span class="num">0</span>,<span class="num">0</span>,<span class="num">0</span>], [<span class="num">-1</span>,<span class="num">1</span>,<span class="num">0</span>]];<br>&nbsp;&nbsp;}<br>}<br><span class="kw">?&gt;</span>',
useCases:["Ensuring code correctness","Regression prevention","TDD (Test-Driven Development)","CI pipeline integration"],
mistakes:["Not writing tests at all","Testing implementation details, not behavior","Not using mocks for external services","Over-mocking (testing nothing)"],
tips:["Use setUp() to reduce duplication","Test public API, not private methods","Use @covers annotation for coverage reporting","Run phpunit with --coverage-html for coverage"],
interview:["What is the difference between unit and integration test?","What is a mock object?","How do data providers work in PHPUnit?"]},
{name:"Deployment & CI/CD",brief:"Deploy PHP apps with CI/CD pipelines and best practices",explanation:"Deployment: copy files to server (FTP/rsync), use version control with deployment tags, or use continuous deployment via CI/CD (GitHub Actions, GitLab CI, Jenkins). Steps: run tests, build assets, optimize autoloader (-o), clear cache, migrate database. Set environment variables. Use OPcache for performance. Enable production mode (display_errors=0).",
syntax:'<span class="cmt"># .github/workflows/deploy.yml</span><br><span class="kw">name</span>: Deploy<br><span class="kw">on</span>: [push]<br><span class="kw">jobs</span>:<br>&nbsp;&nbsp;<span class="kw">deploy</span>:<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">runs-on</span>: ubuntu-latest<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">steps</span>:<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;- <span class="kw">uses</span>: actions/checkout@v3<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;- <span class="kw">run</span>: composer install --no-dev -o<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;- <span class="kw">run</span>: php artisan migrate --force',
codeExample:'<span class="cmt"># Production server checklist</span><br><span class="cmt"># 1. PHP extensions: PDO, mbstring, json, curl, gd</span><br><span class="cmt"># 2. Set php.ini: display_errors=0, opcache.enable=1</span><br><span class="cmt"># 3. Deploy code</span><br><span class="cmt">git pull origin main</span><br><span class="cmt">composer install --no-dev --optimize-autoloader</span><br><span class="cmt">php artisan migrate --force</span><br><span class="cmt">php artisan config:cache</span><br><span class="cmt">php artisan route:cache</span><br><span class="cmt"># 4. Set permissions</span><br><span class="cmt">chown -R www-data:www-data storage/</span><br><span class="cmt">chmod -R 755 storage/</span><br><span class="cmt"># 5. Restart PHP-FPM</span><br><span class="cmt">sudo systemctl restart php8.1-fpm</span><br><span class="cmt"># Nginx config checks</span><br><span class="cmt"># - root points to public/</span><br><span class="cmt"># - index index.php</span><br><span class="cmt"># - try_files  / /index.php?</span>',
useCases:["Production web applications","API server deployment","SaaS application hosting","Enterprise PHP applications"],
mistakes:["Displaying errors in production","Not using OPcache in production","Deploying without running tests","Not having rollback strategy"],
tips:["Use deployment script or tool (Deployer, Envoyer)","CI/CD runs tests before deploy","Use environment-specific config files","Monitor logs and errors in production"],
interview:["What is the deployment workflow for PHP?","Why use OPcache?","What is CI/CD?"]}
]}
]
}
