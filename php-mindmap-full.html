<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PHP Fundamentals - Complete Mind Map</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script>tailwind.config={theme:{extend:{colors:{dark:'#0a0a0f',card:'#12121a',border:'#1e1e2e'}}}}</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
*{font-family:'Inter',sans-serif}
body{background:#0a0a0f;overflow-x:hidden}
.grid-bg{background-image:linear-gradient(rgba(99,102,241,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,0.03) 1px,transparent 1px);background-size:40px 40px}
.topic-card{transition:all .3s ease}
.topic-card:hover{transform:translateY(-3px)}
.subtopic-btn{transition:all .2s ease;text-align:left;font-size:11px}
.subtopic-btn:hover{background:rgba(99,102,241,0.2);transform:translateX(3px)}
.code-block{background:#0d1117;border:1px solid #30363d;border-radius:8px;font-family:'Consolas','Monaco',monospace;font-size:13px;line-height:1.6;overflow-x:auto;padding:14px}
.code-block .kw{color:#ff7b72}.code-block .fn{color:#d2a8ff}.code-block .str{color:#a5d6ff}.code-block .var{color:#ffa657}.code-block .cmt{color:#8b949e}.code-block .num{color:#79c0ff}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#12121a}
::-webkit-scrollbar-thumb{background:#6366f1;border-radius:3px}
.modal-bg{backdrop-filter:blur(8px)}
</style>
</head>
<body class="bg-dark text-white min-h-screen grid-bg" x-data="phpMindmap()">
<header class="fixed top-0 left-0 right-0 z-50 bg-dark/90 backdrop-blur-xl border-b border-border">
<div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-9 h-9 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-sm font-bold">PHP</div>
<div><h1 class="text-base font-semibold">PHP Fundamentals</h1><p class="text-[10px] text-gray-500">Complete Mind Map</p></div>
</div>
<div class="flex items-center gap-2">
<span class="text-xs text-gray-500"><span x-text="completedCount"></span>/<span x-text="totalTopics"></span></span>
<button @click="expandAll()" class="px-3 py-1.5 text-xs bg-indigo-500/20 text-indigo-400 rounded-lg">Expand</button>
<button @click="collapseAll()" class="px-3 py-1.5 text-xs bg-gray-500/20 text-gray-400 rounded-lg">Collapse</button>
</div>
</div>
</header>
<main class="pt-16 pb-8 px-4">
<div class="max-w-7xl mx-auto mb-4"><div class="h-1.5 bg-card rounded-full overflow-hidden"><div class="h-full bg-gradient-to-r from-indigo-500 to-purple-500 transition-all duration-500" :style="'width:'+progressPercent+'%'"></div></div></div>
<div class="max-w-7xl mx-auto space-y-3">
<template x-for="topic in topics" :key="topic.id">
<div class="topic-card bg-card border border-border rounded-xl overflow-hidden" :class="completed.includes(topic.id)?'border-green-500/40':''">
<div class="flex items-center gap-4 p-4 cursor-pointer hover:bg-white/[0.02]" @click="toggleTopic(topic.id)">
<div class="w-10 h-10 rounded-lg flex items-center justify-center text-lg flex-shrink-0" :style="'background:'+topic.color+'20'"><span x-text="topic.icon"></span></div>
<div class="flex-1 min-w-0">
<div class="flex items-center gap-2">
<span class="text-[10px] px-2 py-0.5 rounded-full font-medium" :style="'background:'+topic.color+'20;color:'+topic.color" x-text="'0'+topic.id"></span>
<h2 class="font-semibold text-sm truncate" x-text="topic.title"></h2>
</div>
<p class="text-[11px] text-gray-500 truncate" x-text="topic.description"></p>
</div>
<div class="flex items-center gap-3 flex-shrink-0">
<span class="text-[10px] text-gray-500" x-text="topic.subtopics.length+' subs'"></span>
<button @click.stop="toggleComplete(topic.id)" class="w-6 h-6 rounded-full border-2 flex items-center justify-center transition-colors" :class="completed.includes(topic.id)?'bg-green-500 border-green-500':'border-gray-600'">
<svg x-show="completed.includes(topic.id)" class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
</button>
<svg class="w-4 h-4 text-gray-500 transition-transform" :class="expanded.includes(topic.id)?'rotate-180':''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
</div>
</div>
<div x-show="expanded.includes(topic.id)" x-collapse>
<div class="px-4 pb-4 border-t border-border">
<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-2 pt-3">
<template x-for="(sub,i) in topic.subtopics" :key="i">
<button class="subtopic-btn p-3 rounded-lg bg-dark/50 border border-transparent hover:border-indigo-500/30" @click="openModal(topic,sub)">
<div class="flex items-center gap-2 mb-1">
<div class="w-1.5 h-1.5 rounded-full" :style="'background:'+topic.color"></div>
<span class="text-xs font-medium text-gray-300" x-text="sub.name"></span>
</div>
<p class="text-[10px] text-gray-500 line-clamp-2" x-text="sub.brief"></p>
</button>
</template>
</div>
</div>
</div>
</div>
</template>
</div>
</main>
<!-- Modal -->
<div x-show="showModal" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 z-[100] bg-black/70 modal-bg flex items-center justify-center p-4" @click.self="showModal=false" style="display:none">
<div x-show="showModal" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100" class="bg-card border border-border rounded-2xl w-full max-w-3xl max-h-[85vh] overflow-hidden flex flex-col">
<div class="flex items-center justify-between p-4 border-b border-border flex-shrink-0">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-lg flex items-center justify-center" :style="'background:'+modalData.topicColor+'20'"><span class="text-lg" x-text="modalData.topicIcon"></span></div>
<div><span class="text-[10px] px-2 py-0.5 rounded-full" :style="'background:'+modalData.topicColor+'20;color:'+modalData.topicColor" x-text="modalData.topicTitle"></span><h3 class="font-semibold text-white mt-0.5" x-text="modalData.name"></h3></div>
</div>
<button @click="showModal=false" class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center hover:bg-white/10 flex-shrink-0"><svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
</div>
<div class="overflow-y-auto flex-1 p-4 space-y-4">
<template x-if="modalData.explanation"><div class="bg-dark rounded-xl p-4"><h4 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2"><span>📖</span>Explanation</h4><p class="text-sm text-gray-300 leading-relaxed" x-text="modalData.explanation"></p></div></template>
<template x-if="modalData.syntax"><div class="bg-dark rounded-xl p-4"><h4 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2"><span>💻</span>Syntax</h4><div class="code-block" x-html="modalData.syntax"></div></div></template>
<template x-if="modalData.codeExample"><div class="bg-dark rounded-xl p-4"><h4 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2"><span>📝</span>Code Example</h4><div class="code-block" x-html="modalData.codeExample"></div></div></template>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<template x-if="modalData.useCases&&modalData.useCases.length"><div class="bg-dark rounded-xl p-4"><h4 class="text-xs font-semibold text-green-400 uppercase tracking-wider mb-2">✅ Use Cases</h4><ul class="space-y-1.5"><template x-for="(use,i) in modalData.useCases" :key="i"><li class="text-xs text-gray-400 flex items-start gap-2"><span class="w-1 h-1 rounded-full bg-green-500 mt-1.5 flex-shrink-0"></span><span x-text="use"></span></li></template></ul></div></template>
<template x-if="modalData.mistakes&&modalData.mistakes.length"><div class="bg-dark rounded-xl p-4"><h4 class="text-xs font-semibold text-red-400 uppercase tracking-wider mb-2">⚠️ Common Mistakes</h4><ul class="space-y-1.5"><template x-for="(m,i) in modalData.mistakes" :key="i"><li class="text-xs text-gray-400 flex items-start gap-2"><span class="w-1 h-1 rounded-full bg-red-500 mt-1.5 flex-shrink-0"></span><span x-text="m"></span></li></template></ul></div></template>
</div>
<template x-if="modalData.tips&&modalData.tips.length"><div class="bg-gradient-to-r from-indigo-500/10 to-purple-500/10 rounded-xl p-4 border border-indigo-500/20"><h4 class="text-xs font-semibold text-indigo-400 uppercase tracking-wider mb-2">💡 Pro Tips</h4><ul class="space-y-1.5"><template x-for="(tip,i) in modalData.tips" :key="i"><li class="text-xs text-gray-300 flex items-start gap-2"><span class="text-indigo-400">→</span><span x-text="tip"></span></li></template></ul></div></template>
<template x-if="modalData.interview&&modalData.interview.length"><div class="bg-dark rounded-xl p-4"><h4 class="text-xs font-semibold text-yellow-400 uppercase tracking-wider mb-2">🎤 Interview Questions</h4><ul class="space-y-2"><template x-for="(q,i) in modalData.interview" :key="i"><li class="text-xs text-gray-400 flex items-start gap-2"><span class="text-yellow-500 font-bold" x-text="(i+1)+'.'"></span><span x-text="q"></span></li></template></ul></div></template>
</div>
</div>
</div>
<!-- Learning Structure -->
<div class="max-w-7xl mx-auto mt-8 bg-card border border-border rounded-xl p-6 mb-8">
<h3 class="text-sm font-semibold text-center text-gray-400 mb-4">Recommended Learning Structure for Every Topic</h3>
<div class="grid grid-cols-3 md:grid-cols-5 gap-3 text-center">
<div class="p-2 bg-dark rounded-lg"><span class="text-lg block">📖</span><span class="text-[10px] text-gray-500">Definition</span></div>
<div class="p-2 bg-dark rounded-lg"><span class="text-lg block">📝</span><span class="text-[10px] text-gray-500">Theory</span></div>
<div class="p-2 bg-dark rounded-lg"><span class="text-lg block">💻</span><span class="text-[10px] text-gray-500">Syntax</span></div>
<div class="p-2 bg-dark rounded-lg"><span class="text-lg block">⚠️</span><span class="text-[10px] text-gray-500">Rules</span></div>
<div class="p-2 bg-dark rounded-lg"><span class="text-lg block">⚙️</span><span class="text-[10px] text-gray-500">Internal</span></div>
<div class="p-2 bg-dark rounded-lg"><span class="text-lg block">💡</span><span class="text-[10px] text-gray-500">Examples</span></div>
<div class="p-2 bg-dark rounded-lg"><span class="text-lg block">❌</span><span class="text-[10px] text-gray-500">Mistakes</span></div>
<div class="p-2 bg-dark rounded-lg"><span class="text-lg block">✅</span><span class="text-[10px] text-gray-500">Best Practices</span></div>
<div class="p-2 bg-dark rounded-lg"><span class="text-lg block">🔧</span><span class="text-[10px] text-gray-500">Functions</span></div>
<div class="p-2 bg-dark rounded-lg"><span class="text-lg block">🎤</span><span class="text-[10px] text-gray-500">Interview</span></div>
<div class="p-2 bg-dark rounded-lg"><span class="text-lg block">🏋️</span><span class="text-[10px] text-gray-500">Exercises</span></div>
<div class="p-2 bg-dark rounded-lg"><span class="text-lg block">🚀</span><span class="text-[10px] text-gray-500">Mini Project</span></div>
<div class="p-2 bg-dark rounded-lg"><span class="text-lg block">❓</span><span class="text-[10px] text-gray-500">Quiz</span></div>
<div class="p-2 bg-dark rounded-lg"><span class="text-lg block">📋</span><span class="text-[10px] text-gray-500">Summary</span></div>
<div class="p-2 bg-dark rounded-lg"><span class="text-lg block">➡️</span><span class="text-[10px] text-gray-500">Next Topic</span></div>
</div>
</div>
<script>
function phpMindmap(){
return{
showModal:false,modalData:{},
completed:[],
expanded:[],
totalTopics:21,
get completedCount(){return this.completed.length},
get progressPercent(){return(this.completed.length/this.totalTopics)*100},
toggleTopic(id){let i=this.expanded.indexOf(id);i===-1?this.expanded.push(id):this.expanded.splice(i,1)},
expandAll(){let ids=this.topics.map(t=>t.id);this.expanded=ids},
collapseAll(){this.expanded=[]},
toggleComplete(id){let i=this.completed.indexOf(id);i===-1?this.completed.push(id):this.completed.splice(i,1);this.completed=[...new Set(this.completed)]},
openModal(topic,sub){this.modalData={topicTitle:topic.title,topicColor:topic.color,topicIcon:topic.icon,...sub};this.showModal=true},
topics:[
{id:1,title:"Variables & Data Types",icon:"📦",color:"#6366f1",description:"Store and manipulate data with variables and PHP data types",subtopics:[
{name:"Variable Declaration",brief:"Variables start with $ followed by the name",explanation:"In PHP, variables are declared using the dollar sign $ followed by the variable name. PHP is a loosely typed language, so you don't need to declare the type explicitly. Variable names are case-sensitive and must start with a letter or underscore.",
syntax:'<span class="kw">&lt;?php</span><br><span class="var"></span> <span class="kw">=</span> <span class="str">"value"</span>;<br><span class="kw">?&gt;</span>',
codeExample:'<span class="kw">&lt;?php</span><br><span class="var"></span> <span class="kw">=</span> <span class="str">"John"</span>;<br><span class="var"></span> <span class="kw">=</span> <span class="num">25</span>;<br><span class="var"></span> <span class="kw">=</span> <span class="num">19.99</span>;<br><span class="kw">echo</span> <span class="var"></span>;<br><span class="kw">?&gt;</span>',
useCases:["Storing user input from forms","Holding database query results","Temporary calculations and counters","Configuration values"],
mistakes:["Forgetting the $ prefix","Using spaces or hyphens in names","Assuming case-insensitivity ( != )","Not initializing before use"],
tips:["Use snake_case or camelCase consistently","Initialize variables before loops","unset() removes a variable from memory","Check isset() before accessing undefined vars"],
interview:["What is the difference between echo and print?","How are variables parsed in strings?","What does variable variables () mean?"]},
{name:"Data Types",brief:"PHP supports scalar, compound, and special types",explanation:"PHP has four scalar types (bool, int, float, string), two compound types (array, object), and two special types (resource, NULL). The gettype() function returns the type of a variable. PHP automatically converts types when needed (type juggling).",
syntax:'<span class="var"></span> <span class="kw">=</span> <span class="num">42</span>;<br><span class="var"></span> <span class="kw">=</span> <span class="num">3.14</span>;<br><span class="var"></span> <span class="kw">=</span> <span class="str">"Hello"</span>;<br><span class="var"></span> <span class="kw">=</span> <span class="kw">true</span>;<br><span class="var"></span> <span class="kw">=</span> [<span class="str">"a"</span>,<span class="str">"b"</span>];<br><span class="var"></span> <span class="kw">=</span> <span class="kw">null</span>;',
codeExample:'<span class="kw">&lt;?php</span><br><span class="var"></span> <span class="kw">=</span> <span class="num">99.99</span>; <span class="cmt">// float</span><br><span class="var"></span> <span class="kw">=</span> <span class="num">10</span>; <span class="cmt">// int</span><br><span class="kw">var_dump</span>(<span class="var"></span>); <span class="cmt">// float(99.99)</span><br><span class="kw">echo</span> <span class="kw">gettype</span>(<span class="var"></span>); <span class="cmt">// "integer"</span><br><span class="kw">?&gt;</span>',
useCases:["Numbers in math and counters","Strings for text and HTML output","Booleans for flags and conditions","Arrays for collections of data","NULL for unset values"],
mistakes:["Treating '0' as true in loose comparisons","Assuming float arithmetic is exact","Confusing string and integer comparison","Not using strict comparison (===)"],
tips:["Use var_dump() to debug type and value","Cast types explicitly: (int), (string)","Use is_int(), is_string() to check types","Floats are never compared directly with =="],
interview:["Name all 8 data types in PHP","What is type juggling?","What is the difference between == and ===?"]},
{name:"Type Casting",brief:"Convert variables between different data types",explanation:"Type casting explicitly converts a variable from one type to another. PHP supports (int), (float), (string), (bool), (array), (object), and (unset) casts. PHP also performs automatic type conversion when the operator or context demands it.",
syntax:'<span class="var"></span> <span class="kw">=</span> <span class="str">"42"</span>;<br><span class="var"></span> <span class="kw">=</span> (<span class="kw">int</span>) <span class="var"></span>;<br><span class="var"></span> <span class="kw">=</span> (<span class="kw">bool</span>) <span class="var"></span>;',
codeExample:'<span class="kw">&lt;?php</span><br><span class="var"></span> <span class="kw">=</span> <span class="str">"123"</span>;<br><span class="var"></span> <span class="kw">=</span> (<span class="kw">int</span>) <span class="var"></span>;<br><span class="kw">echo</span> <span class="var"></span> <span class="kw">+</span> <span class="num">10</span>; <span class="cmt">// 133</span><br><span class="var"></span> <span class="kw">=</span> (<span class="kw">bool</span>) <span class="str">""</span>;<br><span class="kw">var_dump</span>(<span class="var"></span>); <span class="cmt">// false</span><br><span class="kw">?&gt;</span>',
useCases:["Sanitizing user input to expected types","Converting API responses to proper types","Enforcing type for calculations","Preparing data for database insertion"],
mistakes:["Casting \"0abc\" to int gives 0","Casting null to string gives \"\"","Casting float to int truncates the decimal","Not checking if cast succeeded"],
tips:["Use intval(), floatval(), strval() functions","settype() changes the variable in place","Cast before comparison to avoid surprises","Empty string casts to false"],
interview:["What happens when you cast \"123abc\" to int?","Difference between (int) and intval()?","How does PHP handle overflow during casting?"]}
]},
{id:2,title:"Constants & Scope",icon:"📍",color:"#8b5cf6",description:"Define immutable values and understand variable scope",subtopics:[
{name:"Constants",brief:"Define values using define() or const",explanation:"Constants are identifiers that cannot change during script execution. They can be defined using define() (runtime) or const keyword (compile-time, only in classes and top-level since PHP 7). Constants are automatically global across the entire script and don't use the $ prefix.",
syntax:'<span class="kw">&lt;?php</span><br><span class="kw">define</span>(<span class="str">"SITE_NAME"</span>, <span class="str">"MyApp"</span>);<br><span class="kw">const</span> <span class="cn">VERSION</span> <span class="kw">=</span> <span class="str">"1.0"</span>;<br><span class="kw">echo</span> <span class="cn">SITE_NAME</span>;<br><span class="kw">?&gt;</span>',
codeExample:'<span class="kw">&lt;?php</span><br><span class="kw">define</span>(<span class="str">"PI"</span>, <span class="num">3.14159</span>);<br><span class="kw">const</span> <span class="cn">MAX_USERS</span> <span class="kw">=</span> <span class="num">100</span>;<br><span class="kw">echo</span> <span class="cn">PI</span>; <span class="cmt">// 3.14159</span><br><span class="cmt">// define("PI", 3.0); // Error: already defined</span><br><span class="kw">?&gt;</span>',
useCases:["Database connection credentials","Configuration values (app name, version)","Mathematical constants (PI, E)","Status codes and error codes"],
mistakes:["Trying to change a constant value","Forgetting constants are case-sensitive by default","Using $ when accessing constants","Defining constant inside a function with const"],
tips:["Use const for class constants","defined() checks if a constant exists","Magic constants: __FILE__, __DIR__","Use UPPERCASE naming convention"],
interview:["Difference between const and define()?","Are constants global?","What are magic constants? Name 3."]},
{name:"Variable Scope",brief:"PHP has local, global, static, and superglobal scopes",explanation:"Variable scope determines where a variable is accessible. Local scope (inside functions), global scope (outside functions), and static scope (persist across function calls). The global keyword imports a global variable into local scope. $GLOBALS array accesses global vars from anywhere.",
syntax:'<span class="var"></span> <span class="kw">=</span> <span class="num">10</span>;<br><span class="kw">function</span> <span class="fn">test</span>() {<br>&nbsp;&nbsp;<span class="kw">global</span> <span class="var"></span>;<br>&nbsp;&nbsp;<span class="kw">echo</span> <span class="var"></span>;<br>}',
codeExample:'<span class="kw">&lt;?php</span><br><span class="var"></span> <span class="kw">=</span> <span class="num">0</span>;<br><span class="kw">function</span> <span class="fn">increment</span>() {<br>&nbsp;&nbsp;<span class="kw">global</span> <span class="var"></span>;<br>&nbsp;&nbsp;<span class="var"></span><span class="kw">++</span>;<br>}<br><span class="fn">increment</span>();<br><span class="kw">echo</span> <span class="var"></span>; <span class="cmt">// 1</span><br><span class="kw">?&gt;</span>',
useCases:["Tracking application state","Settings shared across functions","Modifying config vars at runtime","Managing counters and stats"],
mistakes:["Forgetting global inside functions","Assuming variables persist across function calls","Overwriting  values accidentally","Using global excessively (spaghetti code)"],
tips:["Minimize use of global variables","Use dependency injection instead of global","static variables preserve their value across calls","Use  for read-only global access"],
interview:["What is the difference between global and static?","How do you access a global variable inside a function?","What are superglobals? List 5."]},
{name:"Superglobals",brief:"Built-in global arrays like \, \, \",explanation:"Superglobals are built-in variables that are always accessible regardless of scope. Key ones: $_GET (URL query params), $_POST (form data), $_REQUEST (both), $_SESSION (session data), $_COOKIE, $_SERVER, $_FILES, $_ENV. They are associative arrays.",
syntax:'<span class="var"></span>[<span class="str">"name"</span>]<br><span class="var"></span>[<span class="str">"email"</span>]<br><span class="var"></span>[<span class="str">"REQUEST_METHOD"</span>]',
codeExample:'<span class="kw">&lt;?php</span><br><span class="kw">if</span> (<span class="var"></span>[<span class="str">"REQUEST_METHOD"</span>] <span class="kw">===</span> <span class="str">"POST"</span>) {<br>&nbsp;&nbsp;<span class="var"></span> <span class="kw">=</span> <span class="kw">htmlspecialchars</span>(<span class="var"></span>[<span class="str">"name"</span>]);<br>&nbsp;&nbsp;<span class="kw">echo</span> <span class="str">"Hello, </span><span class="var"></span><span class="str">"</span>;<br>}<br><span class="kw">?&gt;</span>',
useCases:["Processing form submissions","Reading URL parameters","Getting browser info and headers","File uploads handling","Session and cookie management"],
mistakes:["Trusting user input without sanitization","Using  when / is clearer","Not checking if key exists before access","Storing sensitive data in cookies"],
tips:["Always sanitize superglobal values with filter_input()","Use isset() before accessing array keys","['HTTP_HOST'] is user-controlled","Never trust  without validation"],
interview:["Difference between  and ","What is  and why avoid it?","How do you access session variables?"]}
]},
{id:3,title:"Operators",icon:"🔧",color:"#ec4899",description:"Use operators to perform operations on variables and values",subtopics:[

{name:"Comparison & Logical",brief:"==, ===, !=, <, >, &&, || for conditions",explanation:"Comparison operators compare values: == (equal, loose), === (identical, strict), !=/<> (not equal), !== (not identical), <, >, <=, >=. Logical operators combine conditions: &&/nd (AND), ||/or (OR), ! (NOT), xor (exclusive OR). Strict comparison checks both value and type.",

{id:4,title:"Control Flow (if/else)",icon:"🔀",color:"#f59e0b",description:"Control execution flow with conditional statements",subtopics:[
{name:"if/else Statements",brief:"Execute code conditionally based on boolean expressions",explanation:"if/else statements let you execute different blocks of code based on whether a condition is true or false. PHP supports if, else, elseif (one word), and ternary shorthand (?:). The ?? null coalescing operator returns the left side if it exists and is not null, otherwise the right side.",

interview:["Difference between elseif and else if?","How does the ternary operator work?","What is the null coalescing operator ??"]},
{name:"switch Statements",brief:"Select one of many code blocks for a single expression",explanation:"switch compares an expression against multiple values (cases). It uses loose comparison (==). Use reak to exit the switch block; without it, execution falls through to the next case. match (PHP 8.0) is a stricter, expression-based alternative that returns values and uses === comparison.",

{name:"Array Functions",brief:"Sort, filter, merge, map, search arrays with built-ins",explanation:"PHP has extensive array functions: sort/rsort/asort/ksort, array_merge/array_diff/array_intersect, array_map/array_filter/array_reduce, in_array/array_search, array_key_exists, array_pop/array_shift, array_unique, array_reverse, count, array_slice, array_chunk. Many accept callback parameters.",
syntax:'<span class="kw">array_map</span>(<span class="var"></span>, <span class="var"></span>);<br><span class="kw">array_filter</span>(<span class="var"></span>, <span class="var"></span>);<br><span class="kw">in_array</span>(<span class="var"></span>, <span class="var"></span>);',
codeExample:'<span class="kw">&lt;?php</span><br><span class="var"></span> <span class="kw">=</span> [<span class="num">1</span>,<span class="num">2</span>,<span class="num">3</span>,<span class="num">4</span>,<span class="num">5</span>];<br><span class="var"></span> <span class="kw">=</span> <span class="kw">array_map</span>(<span class="kw">fn</span>(<span class="var"></span>) <span class="kw">=&gt;</span> <span class="var"></span><span class="kw">**</span><span class="num">2</span>, <span class="var"></span>);<br><span class="var"></span> <span class="kw">=</span> <span class="kw">array_filter</span>(<span class="var"></span>, <span class="kw">fn</span>(<span class="var"></span>) <span class="kw">=&gt;</span> <span class="var"></span> <span class="kw">%</span> <span class="num">2</span> <span class="kw">===</span> <span class="num">0</span>);<br><span class="kw">sort</span>(<span class="var"></span>);<br><span class="kw">echo</span> <span class="kw">count</span>(<span class="var"></span>); <span class="cmt">// 5</span><br><span class="kw">?&gt;</span>',
useCases:["Data transformation pipelines","Filtering user input","Searching within collections","Sorting and pagination"],
mistakes:["sort() modifies original (pass by reference)","array_merge with numeric keys renumbers","in_array slow for large arrays (use hash lookup)","array_filter with no callback removes falsy"],
tips:["use sort flags: SORT_NUMERIC, SORT_STRING","array_column() extracts column from 2D array","array_walk vs array_map differences","Use array_reduce for aggregation"],
interview:["Difference between array_map and array_walk?","How does array_filter work without callback?","What is the difference between sort and asort?"]},
{name:"Multidimensional Arrays",brief:"Arrays containing arrays for complex data structures",explanation:"Multidimensional arrays (nested arrays) store arrays as elements. Common for representing tabular data, JSON structures, and tree-like data. Access nested elements with multiple indices. Can mix indexed and associative keys across dimensions. Used heavily in database results and API responses.",
syntax:'<span class="var"></span> <span class="kw">=</span> [<br>&nbsp;&nbsp;[<span class="num">1</span>, <span class="num">2</span>],<br>&nbsp;&nbsp;[<span class="num">3</span>, <span class="num">4</span>]<br>];<br><span class="kw">echo</span> <span class="var"></span>[<span class="num">0</span>][<span class="num">1</span>]; <span class="cmt">// 2</span>',
codeExample:'<span class="kw">&lt;?php</span><br><span class="var"></span> <span class="kw">=</span> [<br>&nbsp;&nbsp;[<span class="str">"id"</span><span class="kw">=&gt;</span><span class="num">1</span>, <span class="str">"name"</span><span class="kw">=&gt;</span><span class="str">"John"</span>, <span class="str">"skills"</span><span class="kw">=&gt;</span>[<span class="str">"PHP"</span>,<span class="str">"JS"</span>]],<br>&nbsp;&nbsp;[<span class="str">"id"</span><span class="kw">=&gt;</span><span class="num">2</span>, <span class="str">"name"</span><span class="kw">=&gt;</span><span class="str">"Jane"</span>, <span class="str">"skills"</span><span class="kw">=&gt;</span>[<span class="str">"Python"</span>,<span class="str">"SQL"</span>]]<br>];<br><span class="kw">foreach</span> (<span class="var"></span> <span class="kw">as</span> <span class="var"></span>) {<br>&nbsp;&nbsp;<span class="kw">echo</span> <span class="var"></span>[<span class="str">"name"</span>] <span class="kw">.</span> <span class="str">": "</span> <span class="kw">.</span> <span class="kw">implode</span>(<span class="str">","</span>, <span class="var"></span>[<span class="str">"skills"</span>]);<br>}<br><span class="kw">?&gt;</span>',
useCases:["Tabular data (DB results)","JSON API response parsing","Tree structures (categories, menus)","Matrix math and grids"],
mistakes:["Deep nesting becomes unreadable","Not checking if nested key exists","Assuming consistent dimension depth","Modifying nested arrays by value vs reference"],
tips:["Use isset to check nested keys safely","array_column with null key gets all rows","Use  ?? [] for safe fallback","Limit depth to 2-3 levels"],
interview:["How do you access deeply nested array value?","How to check if key exists at specific depth?","How do you flatten a multidimensional array?"]}
]},
{id:8,title:"Strings & Text Processing",icon:"📝",color:"#f97316",description:"Manipulate text with PHP string functions and encoding",subtopics:[
{name:"String Manipulation",brief:"Functions for joining, splitting, searching, replacing text",explanation:"PHP provides extensive string manipulation: concatenation (.), interpolation (double quotes), strlen, strpos, str_replace, substr, strtolower/strtoupper, 	rim, explode/implode, str_split, strrev, str_repeat, str_pad. Strings can be single-quoted (literals), double-quoted (interpolate variables/escape), heredoc, and nowdoc.",
syntax:'<span class="var"></span> <span class="kw">=</span> <span class="str">"Hello "</span> <span class="kw">.</span> <span class="var"></span>;<br><span class="var"></span> <span class="kw">=</span> <span class="kw">strpos</span>(<span class="var"></span>, <span class="var"></span>);<br><span class="var"></span> <span class="kw">=</span> <span class="kw">explode</span>(<span class="str">","</span>, <span class="var"></span>);',
codeExample:'<span class="kw">&lt;?php</span><br><span class="var"></span> <span class="kw">=</span> <span class="str">"  Hello World!  "</span>;<br><span class="kw">echo</span> <span class="kw">trim</span>(<span class="var"></span>); <span class="cmt">// "Hello World!"</span><br><span class="kw">echo</span> <span class="kw">strlen</span>(<span class="var"></span>); <span class="cmt">// 16 (counts spaces)</span><br><span class="kw">echo</span> <span class="kw">str_replace</span>(<span class="str">"World"</span>, <span class="str">"PHP"</span>, <span class="var"></span>);<br><span class="kw">echo</span> <span class="kw">substr</span>(<span class="str">"abcdef"</span>, <span class="num">1</span>, <span class="num">3</span>); <span class="cmt">// "bcd"</span><br><span class="kw">?&gt;</span>',
useCases:["Formatting user display names","Parsing CSV and log files","Generating dynamic HTML/XML","Sanitizing user input"],
mistakes:["Using .= in loops (O(n^2) string building)","Not accounting for multibyte encoding","strpos returns false (0 is falsy!)","Forgetting trimming before validation"],
tips:["Use [] for character access: [0]","str_starts_with() / str_contains() (PHP 8)","Use ob_start/ob_get_clean for large strings","Use double quotes for simple interpolation"],
interview:["Why is strpos === false important?","How does string interpolation work?","What is the difference between heredoc and nowdoc?"]},
{name:"Regex (PCRE)",brief:"Pattern matching with preg_match, preg_replace, etc.",explanation:"PHP uses PCRE (Perl Compatible Regular Expressions) for pattern matching. Key functions: preg_match (check match), preg_match_all (all matches), preg_replace (search/replace), preg_split (split by pattern), preg_grep (filter array). Patterns are delimited by /. Supports capture groups (), character classes [], quantifiers +*?{}, anchors ^$.",
syntax:'<span class="kw">preg_match</span>(<span class="str">"/pattern/"</span>, <span class="var"></span>, <span class="var"></span>);<br><span class="kw">preg_replace</span>(<span class="str">"/pattern/"</span>, <span class="str">"replacement"</span>, <span class="var"></span>);',
codeExample:'<span class="kw">&lt;?php</span><br><span class="var"></span> <span class="kw">=</span> <span class="str">"user@example.com"</span>;<br><span class="kw">if</span> (<span class="kw">preg_match</span>(<span class="str">"/^[\\w.-]+@[\\w.-]+\\.\\w{2,}$/"</span>, <span class="var"></span>)) {<br>&nbsp;&nbsp;<span class="kw">echo</span> <span class="str">"Valid email"</span>;<br>}<br><span class="var"></span> <span class="kw">=</span> <span class="str">"Phone: 123-456-7890"</span>;<br><span class="var"></span> <span class="kw">=</span> <span class="kw">preg_replace</span>(<span class="str">"/[^\\d]/"</span>, <span class="str">""</span>, <span class="var"></span>);<br><span class="kw">echo</span> <span class="var"></span>; <span class="cmt">// 1234567890</span><br><span class="kw">?&gt;</span>',
useCases:["Email/phone/URL validation","Extracting data from text","Search and replace with patterns","Log file parsing"],
mistakes:["Not escaping delimiters in pattern","Forgetting ^ and $ for full match","Using preg_match vs preg_match_all wrong","Overly complex regex (hard to maintain)"],
tips:["Use raw strings: '/\\d/' or single quotes","Use [1] for first capture group","preg_quote() escapes regex special chars","Add 'u' flag for UTF-8: '/pattern/u'"],
interview:["Difference between preg_match and preg_match_all?","What do modifiers u, i, m do?","How to validate an email with regex?"]}
]},
{id:9,title:"OOP (Classes & Objects)",icon:"🧱",color:"#a855f7",description:"Master object-oriented programming with PHP classes",subtopics:[
{name:"Classes & Objects",brief:"Define classes, instantiate objects, use properties/methods",explanation:"PHP supports class-based OOP. A class is a blueprint; an object is an instance. Properties store data, methods define behavior. $this refers to the current instance. Visibility: public (anywhere), protected (class + subclasses), private (class only). Constructor __construct() is called on instantiation with 
ew.",
syntax:'<span class="kw">class</span> <span class="cn">MyClass</span> {<br>&nbsp;&nbsp;<span class="kw">public</span> <span class="var"></span>;<br>&nbsp;&nbsp;<span class="kw">function</span> <span class="fn">__construct</span>(<span class="var"></span>) {<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="var"></span><span class="kw">-&gt;</span>prop <span class="kw">=</span> <span class="var"></span>;<br>&nbsp;&nbsp;}<br>}<br><span class="var"></span> <span class="kw">=</span> <span class="kw">new</span> <span class="cn">MyClass</span>(<span class="str">"Hello"</span>);',
codeExample:'<span class="kw">&lt;?php</span><br><span class="kw">class</span> <span class="cn">Car</span> {<br>&nbsp;&nbsp;<span class="kw">public</span> <span class="var"></span>;<br>&nbsp;&nbsp;<span class="kw">public</span> <span class="kw">function</span> <span class="fn">__construct</span>(<span class="var"></span>) {<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="var"></span><span class="kw">-&gt;</span>brand <span class="kw">=</span> <span class="var"></span>;<br>&nbsp;&nbsp;}<br>&nbsp;&nbsp;<span class="kw">public</span> <span class="kw">function</span> <span class="fn">honk</span>(): <span class="kw">string</span> {<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> <span class="str">"Beep! I am a </span><span class="var">-&gt;brand</span><span class="str">"</span>;<br>&nbsp;&nbsp;}<br>}<br><span class="var"></span> <span class="kw">=</span> <span class="kw">new</span> <span class="cn">Car</span>(<span class="str">"Toyota"</span>);<br><span class="kw">echo</span> <span class="var"></span><span class="kw">-&gt;</span><span class="fn">honk</span>();<br><span class="kw">?&gt;</span>',
useCases:["Modeling real-world entities","Encapsulating business logic","Building reusable components","Large-scale application architecture"],
mistakes:["Forgetting -> prefix for properties","Using  in static methods","Not initializing typed properties (PHP 7.4+)","Overusing public visibility"],
tips:["Use constructor property promotion (PHP 8)","Declare property types explicitly","Use readonly properties when immutable","Use ::class for full class name string"],
interview:["What is  in PHP?","Difference between public, protected, private?","What is constructor property promotion?"]},
{name:"Inheritance & Traits",brief:"Extend classes and reuse code across class hierarchies",explanation:"Inheritance: a child class extends a parent class, inheriting properties and methods. Override methods by redefining them. Use parent:: to call parent methods. inal prevents override. Traits are reusable code snippets that can be used in multiple classes (horizontal reuse). PHP supports single inheritance only, but multiple traits.",
syntax:'<span class="kw">class</span> <span class="cn">Child</span> <span class="kw">extends</span> <span class="cn">Parent</span> {<br>&nbsp;&nbsp;<span class="kw">use</span> <span class="cn">MyTrait</span>;<br>&nbsp;&nbsp;<span class="kw">public</span> <span class="kw">function</span> <span class="fn">overrideMethod</span>() {<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">parent</span>::<span class="fn">overrideMethod</span>();<br>&nbsp;&nbsp;}<br>}',
codeExample:'<span class="kw">&lt;?php</span><br><span class="kw">trait</span> <span class="cn">Logger</span> {<br>&nbsp;&nbsp;<span class="kw">public</span> <span class="kw">function</span> <span class="fn">log</span>(<span class="var"></span>) { <span class="kw">echo</span> <span class="str">"[LOG] </span><span class="var"></span><span class="str">\n"</span>; }<br>}<br><span class="kw">class</span> <span class="cn">Animal</span> {<br>&nbsp;&nbsp;<span class="kw">protected</span> <span class="var"></span>;<br>&nbsp;&nbsp;<span class="kw">public</span> <span class="kw">function</span> <span class="fn">speak</span>() { <span class="kw">return</span> <span class="str">"..."</span>; }<br>}<br><span class="kw">class</span> <span class="cn">Dog</span> <span class="kw">extends</span> <span class="cn">Animal</span> {<br>&nbsp;&nbsp;<span class="kw">use</span> <span class="cn">Logger</span>;<br>&nbsp;&nbsp;<span class="kw">public</span> <span class="kw">function</span> <span class="fn">speak</span>() { <span class="kw">return</span> <span class="str">"Woof!"</span>; }<br>}<br><span class="var"></span> <span class="kw">=</span> <span class="kw">new</span> <span class="cn">Dog</span>();<br><span class="var"></span><span class="kw">-&gt;</span><span class="fn">log</span>(<span class="var"></span><span class="kw">-&gt;</span><span class="fn">speak</span>()); <span class="cmt">// [LOG] Woof!</span><br><span class="kw">?&gt;</span>',
useCases:["Building class hierarchies (Animal -> Dog)","Sharing methods across unrelated classes","Plugin/hook systems","DRY principle implementation"],
mistakes:["Deep inheritance (more than 2-3 levels)","Trait conflict resolution issues","Overriding without calling parent::","Using extends with final class"],
tips:["Prefer composition over inheritance","Traits can use other traits","Resolve conflicts with insteadof/alias","Use final keyword for security-critical classes"],
interview:["PHP supports multiple inheritance? Explain.","How to resolve trait method conflicts?","What is the difference between trait and abstract class?"]},
{name:"Abstract Classes & Interfaces",brief:"Define contracts and base implementations",explanation:"Abstract classes cannot be instantiated; they define base structure with some implemented methods and some abstract methods. Interfaces define a contract: all methods must be implemented. PHP 8 supports mixins and intersection types. A class can implement multiple interfaces but extend only one class. Interfaces can extend other interfaces.",
syntax:'<span class="kw">interface</span> <span class="cn">MyInterface</span> {<br>&nbsp;&nbsp;<span class="kw">public</span> <span class="kw">function</span> <span class="fn">doSomething</span>(): <span class="kw">void</span>;<br>}<br><span class="kw">abstract</span> <span class="kw">class</span> <span class="cn">Base</span> {<br>&nbsp;&nbsp;<span class="kw">abstract</span> <span class="kw">public</span> <span class="kw">function</span> <span class="fn">mustImpl</span>();<br>}',
codeExample:'<span class="kw">&lt;?php</span><br><span class="kw">interface</span> <span class="cn">Flyable</span> {<br>&nbsp;&nbsp;<span class="kw">public</span> <span class="kw">function</span> <span class="fn">fly</span>(): <span class="kw">string</span>;<br>}<br><span class="kw">abstract</span> <span class="kw">class</span> <span class="cn">Bird</span> {<br>&nbsp;&nbsp;<span class="kw">abstract</span> <span class="kw">public</span> <span class="kw">function</span> <span class="fn">sound</span>(): <span class="kw">string</span>;<br>&nbsp;&nbsp;<span class="kw">public</span> <span class="kw">function</span> <span class="fn">eat</span>() { <span class="kw">return</span> <span class="str">"Eating..."</span>; }<br>}<br><span class="kw">class</span> <span class="cn">Sparrow</span> <span class="kw">extends</span> <span class="cn">Bird</span> <span class="kw">implements</span> <span class="cn">Flyable</span> {<br>&nbsp;&nbsp;<span class="kw">public</span> <span class="kw">function</span> <span class="fn">sound</span>() { <span class="kw">return</span> <span class="str">"Chirp"</span>; }<br>&nbsp;&nbsp;<span class="kw">public</span> <span class="kw">function</span> <span class="fn">fly</span>() { <span class="kw">return</span> <span class="str">"Flying high"</span>; }<br>}<br><span class="kw">?&gt;</span>',
useCases:["Defining API contracts","Strategy and Factory patterns","Dependency injection interfaces","Plugin/module systems"],
mistakes:["Adding implementation to interface methods","Not implementing all interface methods","Using abstract when interface suffices","Over-fragmentation (too many small interfaces)"],
tips:["Interface Segregation: keep interfaces focused","Use abstract for classes with shared state","PHP 8 supports Stringable interface","Use instanceof to check interface implementation"],
interview:["Abstract class vs interface differences?","Can you implement multiple interfaces?","What is the purpose of an interface?"]}
]},
{id:10,title:"Magic Methods & Overloading",icon:"✨",color:"#06b6d4",description:"Leverage PHP magic methods for dynamic behavior",subtopics:[
{name:"Core Magic Methods",brief:"__construct, __destruct, __toString, __invoke, __call",explanation:"Magic methods are special method names starting with __. They are automatically called in certain contexts. Key ones: __construct() (on new), __destruct() (on unset/end), __toString() (when object cast to string), __invoke() (when object called as function), __call()/__callStatic() (calling inaccessible methods), __get()/__set() (accessing inaccessible properties), __isset()/__unset(), __sleep()/__wakeup(), __clone().",
syntax:'<span class="kw">class</span> <span class="cn">MyClass</span> {<br>&nbsp;&nbsp;<span class="kw">public</span> <span class="kw">function</span> <span class="fn">__toString</span>() { <span class="kw">return</span> <span class="str">"string"</span>; }<br>&nbsp;&nbsp;<span class="kw">public</span> <span class="kw">function</span> <span class="fn">__invoke</span>(<span class="var"></span>) { <span class="kw">return</span> <span class="var"></span>; }<br>}',
codeExample:'<span class="kw">&lt;?php</span><br><span class="kw">class</span> <span class="cn">User</span> {<br>&nbsp;&nbsp;<span class="kw">public</span> <span class="kw">function</span> <span class="fn">__toString</span>() {<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> <span class="str">"User object"</span>;<br>&nbsp;&nbsp;}<br>&nbsp;&nbsp;<span class="kw">public</span> <span class="kw">function</span> <span class="fn">__invoke</span>(<span class="var"></span>) {<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> <span class="str">"Called: </span><span class="var"></span><span class="str">"</span>;<br>&nbsp;&nbsp;}<br>}<br><span class="var"></span> <span class="kw">=</span> <span class="kw">new</span> <span class="cn">User</span>();<br><span class="kw">echo</span> <span class="var"></span>; <span class="cmt">// User object (via __toString)</span><br><span class="kw">echo</span> <span class="var"></span>(<span class="str">"hi"</span>); <span class="cmt">// Called: hi (via __invoke)</span><br><span class="kw">?&gt;</span>',
useCases:["Custom object string representation","Callable objects (closures alternative)","Lazy-loading properties","Logging/debugging helpers"],
mistakes:["__get returning by reference issues","__toString must return string (throws error)","Calling too many magic methods (slow)","Not declaring __serialize for custom serialization"],
tips:["use __serialize/__unserialize (PHP 7.4+) over __sleep/__wakeup","__call is 10x slower than explicit methods","Use __debugInfo for var_dump control","Avoid overloading for simple getters/setters"],
interview:["What is the __toString method?","How does __call work?","What is the difference between __get and __set?"]},
{name:"Overloading",brief:"Dynamic property and method handling with __get __call",explanation:"Property overloading: __set() handles setting inaccessible properties, __get() handles reading, __isset() handles isset calls, __unset() handles unset. Method overloading: __call() handles inaccessible instance methods, __callStatic() handles static methods. These enable dynamic attribute patterns like Eloquent models have.",
syntax:'<span class="kw">public</span> <span class="kw">function</span> <span class="fn">__get</span>(<span class="var"></span>) {<br>&nbsp;&nbsp;<span class="kw">return</span> <span class="var"></span><span class="kw">-&gt;</span>data[<span class="var"></span>] <span class="kw">??</span> <span class="kw">null</span>;<br>}<br><span class="kw">public</span> <span class="kw">function</span> <span class="fn">__call</span>(<span class="var"></span>, <span class="var"></span>) { <br>&nbsp;&nbsp;<span class="cmt">// handle dynamic methods</span><br>}',
codeExample:'<span class="kw">&lt;?php</span><br><span class="kw">class</span> <span class="cn">DynamicProps</span> {<br>&nbsp;&nbsp;<span class="kw">private</span> <span class="var"></span> <span class="kw">=</span> [];<br>&nbsp;&nbsp;<span class="kw">public</span> <span class="kw">function</span> <span class="fn">__set</span>(<span class="var"></span>, <span class="var"></span>) {<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="var"></span><span class="kw">-&gt;</span>data[<span class="var"></span>] <span class="kw">=</span> <span class="var"></span>;<br>&nbsp;&nbsp;}<br>&nbsp;&nbsp;<span class="kw">public</span> <span class="kw">function</span> <span class="fn">__get</span>(<span class="var"></span>) {<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> <span class="var"></span><span class="kw">-&gt;</span>data[<span class="var"></span>] <span class="kw">??</span> <span class="kw">null</span>;<br>&nbsp;&nbsp;}<br>}<br><span class="var"></span> <span class="kw">=</span> <span class="kw">new</span> <span class="cn">DynamicProps</span>();<br><span class="var"></span><span class="kw">-&gt;</span>name <span class="kw">=</span> <span class="str">"John"</span>; <span class="cmt">// calls __set</span><br><span class="kw">echo</span> <span class="var"></span><span class="kw">-&gt;</span>name; <span class="cmt">// calls __get</span><br><span class="kw">?&gt;</span>',
useCases:["ORM-style dynamic attributes","Configuration objects with fallbacks","Decorator/proxy patterns","API response wrappers"],
mistakes:["Performance hit from overloading every property","Not handling null returns properly","IDE autocomplete breaks completely","Debugging difficulty with magic methods"],
tips:["Use @property annotations for IDE support","Limit overloading to specific use cases","Consider using __debugInfo for clarity","Combine with ArrayAccess for array-like access"],
interview:["When would you use __get/__set?","What is the performance impact of magic methods?","How does __callStatic work?"]}
]},
{id:11,title:"Namespaces & Autoloading",icon:"🗺️",color:"#e11d48",description:"Organize code with namespaces and autoload classes",subtopics:[
{name:"Namespaces",brief:"Organize code into logical groups, avoid name collisions",explanation:"Namespaces are a way to encapsulate code and avoid naming conflicts. Declared with 
amespace at the top of a file (before any code). Use use to import namespaces. Sub-namespaces use backslash. Multiple namespaces in one file are possible but discouraged. __NAMESPACE__ constant gives current namespace.",
syntax:'<span class="kw">&lt;?php</span><br><span class="kw">namespace</span> <span class="cn">App</span>\\<span class="cn">Models</span>;<br><span class="kw">use</span> <span class="cn">App</span>\\<span class="cn">Controllers</span>\\<span class="cn">UserController</span>;<br><span class="kw">use</span> <span class="cn">App</span>\\<span class="cn">Utils</span>\\<span class="cn">Helper</span> <span class="kw">as</span> <span class="cn">H</span>;',
codeExample:'<span class="kw">&lt;?php</span><br><span class="cmt">// file: App/Models/User.php</span><br><span class="kw">namespace</span> <span class="cn">App</span>\\<span class="cn">Models</span>;<br><span class="kw">class</span> <span class="cn">User</span> { <span class="cmt">/* ... */</span> }<br><span class="cmt">// file: index.php</span><br><span class="kw">require_once</span> <span class="str">"App/Models/User.php"</span>;<br><span class="kw">use</span> <span class="cn">App</span>\\<span class="cn">Models</span>\\<span class="cn">User</span>;<br><span class="var"></span> <span class="kw">=</span> <span class="kw">new</span> <span class="cn">User</span>();<br><span class="kw">?&gt;</span>',
useCases:["Large applications with 100+ classes","Library/framework development","Vendor package isolation","PSR-4 compliant project structure"],
mistakes:["Multiple namespace declarations in one file","Backslash at start (root global) vs relative","Not placing namespace at very top","Forgetting use statement for class"],
tips:["PSR-4: namespace maps to directory structure","Group use statements: use Foo\\{A, B, C} (PHP 7+)","use function/use const for functions/constants","Use Composer for autoloading"],
interview:["What is PSR-4?","Difference between use and require?","How does the namespace backslash work?"]},
{name:"Autoloading",brief:"Automatically load classes with spl_autoload_register or Composer",explanation:"Autoloading automatically loads class files when they are first used. spl_autoload_register() registers autoload functions. Composer provides a PSR-4 autoloader out of the box. The autoloader maps fully qualified class names to file paths. equire/include are manual; autoloading is preferred for modern PHP.",
syntax:'<span class="kw">spl_autoload_register</span>(<span class="kw">function</span>(<span class="var"></span>) {<br>&nbsp;&nbsp;<span class="var"></span> <span class="kw">=</span> __DIR__ <span class="kw">.</span> <span class="str">"/"</span> <span class="kw">.</span> <span class="kw">str_replace</span>(<span class="str">"\\\\"</span>, <span class="str">"/"</span>, <span class="var"></span>) <span class="kw">.</span> <span class="str">".php"</span>;<br>&nbsp;&nbsp;<span class="kw">if</span> (<span class="kw">file_exists</span>(<span class="var"></span>)) <span class="kw">require</span> <span class="var"></span>;<br>});',
codeExample:'<span class="kw">&lt;?php</span><br><span class="cmt">// With Composer in composer.json:</span><br><span class="cmt">// { "autoload": { "psr-4": { "App\\\\": "src/" } } }</span><br><span class="cmt">// Then run: composer dump-autoload</span><br><span class="kw">require_once</span> __DIR__ <span class="kw">.</span> <span class="str">"/vendor/autoload.php"</span>;<br><span class="kw">use</span> <span class="cn">App</span>\\<span class="cn">Controllers</span>\\<span class="cn">HomeController</span>;<br><span class="cmt">// Class is autoloaded from src/Controllers/HomeController.php</span><br><span class="var"></span> <span class="kw">=</span> <span class="kw">new</span> <span class="cn">HomeController</span>();<br><span class="kw">?&gt;</span>',
useCases:["Every modern PHP project","Framework loading (Laravel, Symfony)","Library/package distribution","Reducing manual require calls"],
mistakes:["Not running composer dump-autoload after adding classes","Incorrect namespace vs directory mapping","Class name case-sensitivity on case-sensitive OS","Class file not found due to wrong path"],
tips:["Always use Composer autoloading","PSR-4 is case-sensitive","Use classmap for legacy libraries","Optimize autoload for production"],
interview:["How does PSR-4 autoloading work?","What does composer dump-autoload do?","Difference between PSR-0 and PSR-4?"]}
]},
{id:12,title:"Error Handling & Exceptions",icon:"⚠️",color:"#ef4444",description:"Handle errors gracefully with exceptions and error handlers",subtopics:[
{name:"Try/Catch/Finally",brief:"Catch and handle exceptions with try-catch blocks",explanation:"Exceptions are thrown with 	hrow and caught with 	ry/catch. Multiple catch blocks handle different exception types. inally block always executes (PHP 5.5+). PHP 8.0+ has catch without variable (if you don't need the exception). All exceptions should extend \Exception or implement \Throwable.",
syntax:'<span class="kw">try</span> {<br>&nbsp;&nbsp;<span class="cmt">// code that may throw</span><br>} <span class="kw">catch</span> (<span class="cn">\\Exception</span> <span class="var"></span>) {<br>&nbsp;&nbsp;<span class="kw">echo</span> <span class="var"></span><span class="kw">-&gt;</span><span class="fn">getMessage</span>();<br>} <span class="kw">finally</span> {<br>&nbsp;&nbsp;<span class="cmt">// always executes</span><br>}',
codeExample:'<span class="kw">&lt;?php</span><br><span class="kw">try</span> {<br>&nbsp;&nbsp;<span class="var"></span> <span class="kw">=</span> <span class="num">10</span> <span class="kw">/</span> <span class="num">0</span>;<br>} <span class="kw">catch</span> (<span class="cn">DivisionByZeroError</span> <span class="var"></span>) {<br>&nbsp;&nbsp;<span class="kw">echo</span> <span class="str">"Cannot divide by zero!"</span>;<br>} <span class="kw">finally</span> {<br>&nbsp;&nbsp;<span class="kw">echo</span> <span class="str">"Done."</span>;<br>}<br><span class="cmt">// Custom exception</span><br><span class="kw">class</span> <span class="cn">ValidationException</span> <span class="kw">extends</span> <span class="cn">\\Exception</span> {}<br><span class="kw">throw</span> <span class="kw">new</span> <span class="cn">ValidationException</span>(<span class="str">"Invalid input"</span>);<br><span class="kw">?&gt;</span>',
useCases:["Database query error handling","API failure recovery","File operation error handling","Form validation flow control"],
mistakes:["Catching generic Exception instead of specific type","Empty catch blocks (swallowing errors)","Using exceptions for normal flow control","Not cleaning up resources in catch"],
tips:["Log exceptions with file and line","Use try/finally for cleanup without catch","Throw \InvalidArgumentException for bad args","Use getCode() for error codes"],
interview:["What is the difference between Exception and Error?","Can try have multiple catch blocks?","What does finally do?"]},
{name:"Custom Error Handling",brief:"set_error_handler, Error classes, and error reporting",explanation:"PHP has two systems: errors (legacy warnings/notices) and exceptions (Throwable). set_error_handler() converts errors to exceptions. error_reporting() controls which errors are reported. PHP 7+ uses Error classes (EngineException replacement) for fatal errors. 	rigger_error() fires a user-level error. Key: TypeError, ValueError, ArithmeticError.",
syntax:'<span class="kw">set_error_handler</span>(<span class="kw">function</span>(<span class="var"></span>, <span class="var"></span>, <span class="var"></span>, <span class="var"></span>) {<br>&nbsp;&nbsp;<span class="kw">throw</span> <span class="kw">new</span> <span class="cn">\\ErrorException</span>(<span class="var"></span>, <span class="num">0</span>, <span class="var"></span>, <span class="var"></span>, <span class="var"></span>);<br>});',
codeExample:'<span class="kw">&lt;?php</span><br><span class="kw">set_error_handler</span>(<span class="kw">fn</span>(<span class="var"></span>, <span class="var"></span>) <span class="kw">=&gt;</span> <span class="kw">throw</span> <span class="kw">new</span> <span class="cn">\\ErrorException</span>(<span class="var"></span>));<br><span class="kw">try</span> {<br>&nbsp;&nbsp;<span class="kw">strlen</span>(); <span class="cmt">// triggers error, now exception</span><br>} <span class="kw">catch</span> (<span class="cn">\\Throwable</span> <span class="var"></span>) {<br>&nbsp;&nbsp;<span class="kw">echo</span> <span class="var"></span><span class="kw">-&gt;</span><span class="fn">getMessage</span>();<br>}<br><span class="kw">restore_error_handler</span>();<br><span class="kw">?&gt;</span>',
useCases:["Converting legacy warnings to exceptions","Custom logging for all errors","Development vs production error display","Specific error type handling"],
mistakes:["Not restoring error handler after registration","Assuming all errors go through set_error_handler","Fatal errors bypass error handler","Displaying errors in production"],
tips:["Use Whoops! for development error pages","Log errors, never display in production","Use assert() for debugging (development only)","Set display_errors=0 in production"],
interview:["What errors can set_error_handler NOT catch?","Difference between Error and Exception?","How do you log errors in PHP?"]}
]},
{id:13,title:"File Handling & I/O",icon:"📁",color:"#22c55e",description:"Read, write, and manage files and directories",subtopics:[
{name:"Reading & Writing Files",brief:"fopen, fgets, file_get_contents, fwrite, fclose",explanation:"PHP provides multiple ways to read/write files: ile_get_contents() (read entire file to string), ile() (read to array by lines), open()/gets()/write()/close() (stream-based). Writing: ile_put_contents() (write string to file), write(). Modes:  (read), w (write, truncate),  (append), + (read/write).",
syntax:'<span class="var"></span> <span class="kw">=</span> <span class="kw">file_get_contents</span>(<span class="str">"file.txt"</span>);<br><span class="kw">file_put_contents</span>(<span class="str">"file.txt"</span>, <span class="var"></span>);<br><span class="var"></span> <span class="kw">=</span> <span class="kw">fopen</span>(<span class="str">"log.txt"</span>, <span class="str">"a"</span>);<br><span class="kw">fwrite</span>(<span class="var"></span>, <span class="str">"log entry\n"</span>);<br><span class="kw">fclose</span>(<span class="var"></span>);',
codeExample:'<span class="kw">&lt;?php</span><br><span class="cmt">// Read</span><br><span class="var"></span> <span class="kw">=</span> <span class="kw">file_get_contents</span>(<span class="str">"users.json"</span>);<br><span class="var"></span> <span class="kw">=</span> <span class="kw">json_decode</span>(<span class="var"></span>, <span class="kw">true</span>);<br><span class="cmt">// Write</span><br><span class="var"></span> <span class="kw">=</span> <span class="kw">date</span>(<span class="str">"Y-m-d H:i:s"</span>) <span class="kw">.</span> <span class="str">" - Request made\n"</span>;<br><span class="kw">file_put_contents</span>(<span class="str">"access.log"</span>, <span class="var"></span>, FILE_APPEND);<br><span class="cmt">// Stream</span><br><span class="var"></span> <span class="kw">=</span> <span class="kw">fopen</span>(<span class="str">"large.csv"</span>, <span class="str">"r"</span>);<br><span class="kw">while</span> ((<span class="var"></span> <span class="kw">=</span> <span class="kw">fgetcsv</span>(<span class="var"></span>)) <span class="kw">!==</span> <span class="kw">false</span>) {<br>&nbsp;&nbsp;<span class="cmt">// process each row</span><br>}<br><span class="kw">fclose</span>(<span class="var"></span>);<br><span class="kw">?&gt;</span>',
useCases:["Configuration file parsing","CSV data import/export","Log file writing","Template file loading"],
mistakes:["Forgetting to close file handles","No check for file_exists before reading","Not using LOCK_EX for concurrent writes","Using file_get_contents for huge files (memory)"]},
{name:"File System Functions",brief:"Manage files and directories: mkdir, unlink, scandir",explanation:"PHP provides filesystem operations: mkdir()/mdir() (directories), unlink() (delete file), copy()/ename(), ile_exists()/is_file()/is_dir(), ilesize(), scandir() (list directory), pathinfo() (parse path), asename()/dirname(), glob() (pattern matching), ealpath() (canonicalize path).",
syntax:'<span class="kw">mkdir</span>(<span class="str">"uploads"</span>, <span class="num">0755</span>);<br><span class="kw">unlink</span>(<span class="str">"old.txt"</span>);<br><span class="kw">copy</span>(<span class="str">"source.txt"</span>, <span class="str">"dest.txt"</span>);<br><span class="var"></span> <span class="kw">=</span> <span class="kw">glob</span>(<span class="str">"*.php"</span>);',
codeExample:'<span class="kw">&lt;?php</span><br><span class="kw">if</span> (<span class="kw">!file_exists</span>(<span class="str">"data"</span>)) {<br>&nbsp;&nbsp;<span class="kw">mkdir</span>(<span class="str">"data"</span>, <span class="num">0755</span>, <span class="kw">true</span>);<br>}<br><span class="var"></span> <span class="kw">=</span> <span class="kw">scandir</span>(<span class="str">"data"</span>);<br><span class="kw">foreach</span> (<span class="var"></span> <span class="kw">as</span> <span class="var"></span>) {<br>&nbsp;&nbsp;<span class="kw">if</span> (<span class="kw">pathinfo</span>(<span class="var"></span>, PATHINFO_EXTENSION) <span class="kw">===</span> <span class="str">"txt"</span>) {<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">echo</span> <span class="var"></span> <span class="kw">.</span> <span class="str">"\n"</span>;<br>&nbsp;&nbsp;}<br>}<br><span class="kw">?&gt;</span>',
useCases:["Creating upload directories","Deleting temporary files","Directory listing for file managers","File type validation by extension"],
mistakes:["Not checking write permissions","Assuming directory creation succeeds","Path traversal vulnerabilities","Using unlink without file_exists check"],
tips:["Use is_writable() before writing","Use realpath() to normalize paths","Use DIRECTORY_SEPARATOR constant","Temp files: sys_get_temp_dir()"],
interview:["How do you create a directory recursively?","What does glob() do?","How do you safely delete files?"]}
]},
{id:14,title:"Forms & Superglobals",icon:"📋",color:"#065f46",description:"Handle HTML forms with GET/POST and validate input",subtopics:[
{name:"Form Handling",brief:"Process form data via , , and validate",explanation:"HTML forms send data via GET (query string) or POST (request body). PHP accesses them via $_GET and $_POST superglobals. $_REQUEST combines both. htmlspecialchars() prevents XSS. strip_tags() removes HTML. ilter_var()/ilter_input() for validation/sanitization. Always validate server-side even with client-side validation.",
syntax:'<span class="kw">&lt;form method="post"&gt;</span><br>&nbsp;&nbsp;<span class="kw">&lt;input type="text" name="email"&gt;</span><br>&nbsp;&nbsp;<span class="kw">&lt;input type="submit"&gt;</span><br><span class="kw">&lt;/form&gt;</span><br><span class="kw">&lt;?php</span><br><span class="kw">if</span> (<span class="var"></span>[<span class="str">"REQUEST_METHOD"</span>] <span class="kw">===</span> <span class="str">"POST"</span>) {<br>&nbsp;&nbsp;<span class="var"></span> <span class="kw">=</span> <span class="kw">filter_input</span>(INPUT_POST, <span class="str">"email"</span>, FILTER_VALIDATE_EMAIL);<br>}<br><span class="kw">?&gt;</span>',
codeExample:'<span class="kw">&lt;?php</span><br><span class="var"></span> <span class="kw">=</span> [];<br><span class="kw">if</span> (<span class="var"></span>[<span class="str">"REQUEST_METHOD"</span>] <span class="kw">===</span> <span class="str">"POST"</span>) {<br>&nbsp;&nbsp;<span class="var"></span> <span class="kw">=</span> <span class="kw">trim</span>(<span class="var"></span>[<span class="str">"name"</span>] <span class="kw">??</span> <span class="str">""</span>);<br>&nbsp;&nbsp;<span class="kw">if</span> (<span class="kw">empty</span>(<span class="var"></span>)) {<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="var"></span>[] <span class="kw">=</span> <span class="str">"Name is required"</span>;<br>&nbsp;&nbsp;}<br>&nbsp;&nbsp;<span class="var"></span> <span class="kw">=</span> <span class="kw">filter_input</span>(INPUT_POST, <span class="str">"email"</span>, FILTER_VALIDATE_EMAIL);<br>&nbsp;&nbsp;<span class="kw">if</span> (<span class="var"></span> <span class="kw">===</span> <span class="kw">false</span>) {<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="var"></span>[] <span class="kw">=</span> <span class="str">"Invalid email"</span>;<br>&nbsp;&nbsp;}<br>}<br><span class="kw">?&gt;</span>',
useCases:["Contact forms","User registration/login","Search functionality","Feedback/survey forms"],
mistakes:["Trusting  info without validation","Not checking form method (GET vs POST)","Forgetting enctype for file uploads","XSS via unescaped output"],
tips:["Always use htmlspecialchars() on output","Use filter_input() for validation","Reverse CSRF with tokens","Separate form display and processing"],
interview:["Difference between GET and POST?","How to prevent XSS in form output?","What does filter_input return on failure?"]},
{name:"File Uploads",brief:"Handle file uploads with  and move_uploaded_file",explanation:"File uploads require <form enctype="multipart/form-data">. $_FILES superglobal contains file info: name, type, tmp_name, error, size. move_uploaded_file() moves from temp to target. Validate: file size, extension/MIME type. is_uploaded_file() checks legitimacy. Beware of double extensions and MIME spoofing.",
syntax:'<span class="kw">&lt;form enctype="multipart/form-data" method="post"&gt;</span><br>&nbsp;&nbsp;<span class="kw">&lt;input type="file" name="file"&gt;</span><br><span class="kw">&lt;/form&gt;</span><br><span class="kw">&lt;?php</span><br><span class="kw">if</span> (<span class="var"></span>[<span class="str">"file"</span>][<span class="str">"error"</span>] <span class="kw">===</span> UPLOAD_ERR_OK) {<br>&nbsp;&nbsp;<span class="kw">move_uploaded_file</span>(<span class="var"></span>[<span class="str">"file"</span>][<span class="str">"tmp_name"</span>], <span class="str">"uploads/"</span>.<span class="var"></span>);<br>}<br><span class="kw">?&gt;</span>',
codeExample:'<span class="kw">&lt;?php</span><br><span class="var"></span> <span class="kw">=</span> [<span class="str">"jpg"</span>, <span class="str">"png"</span>, <span class="str">"pdf"</span>];<br><span class="var"></span> <span class="kw">=</span> <span class="var"></span>[<span class="str">"document"</span>];<br><span class="var"></span> <span class="kw">=</span> <span class="kw">strtolower</span>(<span class="kw">pathinfo</span>(<span class="var"></span>[<span class="str">"name"</span>], PATHINFO_EXTENSION));<br><span class="kw">if</span> (<span class="kw">in_array</span>(<span class="var"></span>, <span class="var"></span>)) {<br>&nbsp;&nbsp;<span class="var"></span> <span class="kw">=</span> <span class="kw">uniqid</span>() <span class="kw">.</span> <span class="str">"."</span> <span class="kw">.</span> <span class="var"></span>;<br>&nbsp;&nbsp;<span class="kw">move_uploaded_file</span>(<span class="var"></span>[<span class="str">"tmp_name"</span>], <span class="str">"uploads/"</span> <span class="kw">.</span> <span class="var"></span>);<br>}<br><span class="kw">?&gt;</span>',
useCases:["Profile picture upload","Document submission","CSV import","Media attachments"],
mistakes:["Not checking upload error code","Relying on ['type'] (user-controlled)","Not limiting file size","Serving uploaded files from upload dir directly"],
tips:["Use finfo to verify actual MIME type","Store files outside webroot","Use random filenames to prevent overwrite","Check php.ini upload_max_filesize"],
interview:["How does  work?","What is move_uploaded_file()?","How to validate file types securely?"]}
]},
{id:15,title:"Sessions & Cookies",icon:"🍪",color:"#d946ef",description:"Maintain state across requests with sessions and cookies",subtopics:[
{name:"Session Management",brief:"Start, store, and destroy session data securely",explanation:"Sessions store user data across requests on the server. Session ID is stored in a cookie (default) or URL. session_start() must be called before any output. Superglobal $_SESSION stores/retrieves data. session_destroy() clears all data. Session configuration: session_set_cookie_params(), session save handlers. Default files-based session storage.",
syntax:'<span class="kw">session_start</span>();<br><span class="var"></span>[<span class="str">"user_id"</span>] <span class="kw">=</span> <span class="num">42</span>;<br><span class="var"></span> <span class="kw">=</span> <span class="var"></span>[<span class="str">"user_id"</span>] <span class="kw">??</span> <span class="kw">null</span>;<br><span class="kw">session_destroy</span>();<br><span class="kw">session_regenerate_id</span>();',
codeExample:'<span class="kw">&lt;?php</span><br><span class="kw">session_start</span>();<br><span class="kw">if</span> (<span class="kw">!isset</span>(<span class="var"></span>[<span class="str">"visits"</span>])) {<br>&nbsp;&nbsp;<span class="var"></span>[<span class="str">"visits"</span>] <span class="kw">=</span> <span class="num">0</span>;<br>}<br><span class="var"></span>[<span class="str">"visits"</span>]<span class="kw">++</span>;<br><span class="kw">echo</span> <span class="str">"Visits: "</span> <span class="kw">.</span> <span class="var"></span>[<span class="str">"visits"</span>];<br><span class="cmt">// Secure session cookie</span><br><span class="kw">session_set_cookie_params</span>([<br>&nbsp;&nbsp;<span class="str">"lifetime"</span> <span class="kw">=&gt;</span> <span class="num">3600</span>,<br>&nbsp;&nbsp;<span class="str">"secure"</span> <span class="kw">=&gt;</span> <span class="kw">true</span>,<br>&nbsp;&nbsp;<span class="str">"httponly"</span> <span class="kw">=&gt;</span> <span class="kw">true</span>,<br>&nbsp;&nbsp;<span class="str">"samesite"</span> <span class="kw">=&gt;</span> <span class="str">"Strict"</span><br>]);<br><span class="kw">session_start</span>();<br><span class="kw">?&gt;</span>',
useCases:["User login state","Shopping cart data","Wizard/form progress","Flash messages"],
mistakes:["Starting session after output","Not regenerating session ID after login","Storing sensitive data in session","Ignoring session garbage collection"],
tips:["Regenerate session ID on privilege escalation","Use database/Redis for session storage","Set secure, httpOnly, SameSite flags","Implement session timeout"],
interview:["What does session_start() do?","How to secure session cookies?","Difference between session and cookie?"]},
{name:"Cookies",brief:"Set, read, and delete cookies with setcookie()",explanation:"Cookies are client-side data stored in browser. setcookie() sends a cookie header. Parameters: name, value, expire (timestamp), path, domain, secure, httponly, samesite. $_COOKIE reads incoming cookies. Delete by setting expiry in the past. Cookies are sent with every request (can impact performance). Max size ~4KB.",
syntax:'<span class="kw">setcookie</span>(<span class="str">"name"</span>, <span class="str">"value"</span>, [<br>&nbsp;&nbsp;<span class="str">"expires"</span> <span class="kw">=&gt;</span> <span class="kw">time</span>() <span class="kw">+</span> <span class="num">86400</span>,<br>&nbsp;&nbsp;<span class="str">"secure"</span> <span class="kw">=&gt;</span> <span class="kw">true</span>,<br>&nbsp;&nbsp;<span class="str">"httponly"</span> <span class="kw">=&gt;</span> <span class="kw">true</span>,<br>]);<br><span class="kw">echo</span> <span class="var"></span>[<span class="str">"name"</span>] <span class="kw">??</span> <span class="str">"not set"</span>;',
codeExample:'<span class="kw">&lt;?php</span><br><span class="cmt">// Set a cookie that expires in 7 days</span><br><span class="kw">setcookie</span>(<span class="str">"theme"</span>, <span class="str">"dark"</span>, <span class="kw">time</span>() <span class="kw">+</span> <span class="num">604800</span>, <span class="str">"/"</span>);<br><span class="cmt">// Read cookie</span><br><span class="var"></span> <span class="kw">=</span> <span class="var"></span>[<span class="str">"theme"</span>] <span class="kw">??</span> <span class="str">"light"</span>;<br><span class="cmt">// Delete cookie</span><br><span class="kw">setcookie</span>(<span class="str">"theme"</span>, <span class="str">""</span>, <span class="kw">time</span>() <span class="kw">-</span> <span class="num">3600</span>);<br><span class="kw">?&gt;</span>',
useCases:["User preferences (theme, language)","Remember-me tokens","Tracking affiliate referrals","A/B testing buckets"],
mistakes:["setcookie must be called before HTML output","Storing sensitive data (passwords) in cookies","Not validating cookie values (user can modify)","Cookie size limit (4KB)"],
tips:["Use httponly to prevent JS access","Sign/encrypt cookie values for integrity","Use SameSite=Strict to prevent CSRF","Delete: set expiry in the past"],
interview:["How do you delete a cookie?","What are httponly and secure flags?","Cookie vs session - when to use each?"]}
]},
{id:16,title:"Database & MySQL (PDO)",icon:"🗄️",color:"#0d9488",description:"Connect to MySQL and perform CRUD with PDO securely",subtopics:[
{name:"PDO Connection & CRUD",brief:"Connect to MySQL, execute queries with prepared statements",explanation:"PDO (PHP Data Objects) provides a consistent interface for database access. Supports MySQL, PostgreSQL, SQLite, etc. Key: PDO constructor (DSN, user, pass), query() (simple SELECT), prepare()/execute() (prepared statements prevent SQL injection), etch()/etchAll() (get results), lastInsertId(), eginTransaction()/commit()/ollback(). Error mode: PDO::ERRMODE_EXCEPTION.",
syntax:'<span class="var"></span> <span class="kw">=</span> <span class="kw">new</span> <span class="cn">PDO</span>(<span class="str">"mysql:host=localhost;dbname=test"</span>, <span class="var"></span>, <span class="var"></span>);<br><span class="var"></span> <span class="kw">=</span> <span class="var"></span><span class="kw">-&gt;</span><span class="fn">prepare</span>(<span class="str">"SELECT * FROM users WHERE id = ?"</span>);<br><span class="var"></span><span class="kw">-&gt;</span><span class="fn">execute</span>([<span class="var"></span>]);<br><span class="var"></span> <span class="kw">=</span> <span class="var"></span><span class="kw">-&gt;</span><span class="fn">fetch</span>(PDO::FETCH_ASSOC);',
codeExample:'<span class="kw">&lt;?php</span><br><span class="kw">try</span> {<br>&nbsp;&nbsp;<span class="var"></span> <span class="kw">=</span> <span class="kw">new</span> <span class="cn">PDO</span>(<span class="str">"mysql:host=localhost;dbname=app"</span>, <span class="str">"root"</span>, <span class="str">""</span>);<br>&nbsp;&nbsp;<span class="var"></span><span class="kw">-&gt;</span><span class="fn">setAttribute</span>(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);<br>&nbsp;&nbsp;<span class="cmt">// INSERT</span><br>&nbsp;&nbsp;<span class="var"></span> <span class="kw">=</span> <span class="var"></span><span class="kw">-&gt;</span><span class="fn">prepare</span>(<span class="str">"INSERT INTO users (name, email) VALUES (?, ?)"</span>);<br>&nbsp;&nbsp;<span class="var"></span><span class="kw">-&gt;</span><span class="fn">execute</span>([<span class="str">"John"</span>, <span class="str">"john@example.com"</span>]);<br>&nbsp;&nbsp;<span class="kw">echo</span> <span class="var"></span><span class="kw">-&gt;</span><span class="fn">lastInsertId</span>();<br>&nbsp;&nbsp;<span class="cmt">// SELECT</span><br>&nbsp;&nbsp;<span class="var"></span> <span class="kw">=</span> <span class="var"></span><span class="kw">-&gt;</span><span class="fn">query</span>(<span class="str">"SELECT * FROM users"</span>)<span class="kw">-&gt;</span><span class="fn">fetchAll</span>(PDO::FETCH_ASSOC);<br>} <span class="kw">catch</span> (<span class="cn">PDOException</span> <span class="var"></span>) {<br>&nbsp;&nbsp;<span class="kw">echo</span> <span class="str">"DB Error: "</span> <span class="kw">.</span> <span class="var"></span><span class="kw">-&gt;</span><span class="fn">getMessage</span>();<br>}<br><span class="kw">?&gt;</span>',
useCases:["User account management","Content management (posts, articles)","E-commerce product catalog","Analytics data storage"],
mistakes:["SQL injection with raw query interpolation","Not using prepared statements","Leaving error mode as silent","Not closing connection (PDO nullifies)"],
tips:["Always use prepared statements for user data","Use named placeholders :name for readability","Use FETCH_CLASS to hydrate objects","Use transactions for multi-step operations"],
interview:["What is SQL injection and how to prevent?","What does PDO::FETCH_ASSOC do?","Difference between query() and prepare()?"]},
{name:"Joins & Relations",brief:"Join tables with INNER, LEFT, RIGHT and manage relations",explanation:"SQL joins combine rows from multiple tables based on related columns. INNER JOIN (only matching), LEFT JOIN (all from left, NULL on right), RIGHT JOIN (all from right, NULL on left), CROSS JOIN (Cartesian product). Foreign keys enforce referential integrity. Relations: One-to-One, One-to-Many (hasMany/belongsTo), Many-to-Many (pivot table).",
syntax:'<span class="kw">SELECT</span> users.name, orders.total<br><span class="kw">FROM</span> users<br><span class="kw">INNER JOIN</span> orders <span class="kw">ON</span> users.id <span class="kw">=</span> orders.user_id<br><span class="kw">WHERE</span> orders.status <span class="kw">=</span> <span class="str">"active"</span>',
