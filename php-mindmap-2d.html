<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHP Fundamentals Mind Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dark': '#0a0a0f',
                        'card': '#12121a',
                        'border': '#1e1e2e',
                        'accent': '#6366f1',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #0a0a0f;
            overflow-x: hidden;
        }

        .mindmap-container {
            position: relative;
            width: 100%;
            min-height: 100vh;
        }

        /* Central Node */
        .center-node {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
        }

        /* Branch Lines */
        .branch-line {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, #6366f1, transparent);
            transform-origin: left center;
            z-index: 10;
        }

        /* Topic Nodes */
        .topic-node {
            position: absolute;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .topic-node:hover {
            transform: scale(1.05);
            z-index: 40;
        }

        /* Subtopic Pills */
        .subtopic-pill {
            transition: all 0.3s ease;
        }

        .subtopic-pill:hover {
            transform: translateX(5px);
            background: rgba(99, 102, 241, 0.3);
        }

        /* Glow Effects */
        .glow-purple {
            box-shadow: 0 0 60px rgba(99, 102, 241, 0.3);
        }

        .glow-green {
            box-shadow: 0 0 40px rgba(34, 197, 94, 0.2);
        }

        .glow-orange {
            box-shadow: 0 0 40px rgba(249, 115, 22, 0.2);
        }

        .glow-cyan {
            box-shadow: 0 0 40px rgba(6, 182, 212, 0.2);
        }

        .glow-pink {
            box-shadow: 0 0 40px rgba(236, 72, 153, 0.2);
        }

        .glow-yellow {
            box-shadow: 0 0 40px rgba(234, 179, 8, 0.2);
        }

        /* Pulse Animation */
        @keyframes pulse-ring {
            0% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.7; }
            50% { transform: translate(-50%, -50%) scale(1.05); opacity: 0.3; }
            100% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.7; }
        }

        .pulse-ring {
            animation: pulse-ring 3s ease-in-out infinite;
        }

        /* Grid Background */
        .grid-bg {
            background-image: 
                linear-gradient(rgba(99, 102, 241, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* Connection Lines SVG */
        .connections {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .connection-path {
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
        }

        /* Detail Panel */
        .detail-panel {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .detail-panel.hidden-panel {
            transform: translateX(100%);
            opacity: 0;
        }

        .detail-panel.visible-panel {
            transform: translateX(0);
            opacity: 1;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #12121a;
        }

        ::-webkit-scrollbar-thumb {
            background: #6366f1;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-dark text-white min-h-screen grid-bg" x-data="mindmap()">
    
    <!-- Header -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-dark/80 backdrop-blur-xl border-b border-border">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center">
                    <span class="text-white font-bold text-lg">P</span>
                </div>
                <div>
                    <h1 class="text-lg font-semibold text-white">PHP Fundamentals</h1>
                    <p class="text-xs text-gray-500">Interactive Mind Map</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <button @click="resetView()" class="px-4 py-2 text-sm text-gray-400 hover:text-white transition-colors">
                    Reset View
                </button>
                <button @click="showPanel = !showPanel" class="px-4 py-2 bg-indigo-500/20 text-indigo-400 rounded-lg text-sm font-medium hover:bg-indigo-500/30 transition-colors">
                    <span x-text="showPanel ? 'Hide Details' : 'Show Details'"></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Mind Map -->
    <main class="mindmap-container pt-20">
        
        <!-- SVG Connections -->
        <svg class="connections" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
            <!-- Variable Connection -->
            <path class="connection-path" stroke="#6366f1" d="M960,540 Q800,400 650,320" opacity="0.4"/>
            <!-- Loop Connection -->
            <path class="connection-path" stroke="#22c55e" d="M960,540 Q1100,380 1300,280" opacity="0.4"/>
            <!-- Conditions Connection -->
            <path class="connection-path" stroke="#f97316" d="M960,540 Q750,550 580,540" opacity="0.4"/>
            <!-- Operators Connection -->
            <path class="connection-path" stroke="#06b6d4" d="M960,540 Q1150,580 1350,560" opacity="0.4"/>
            <!-- Functions Connection -->
            <path class="connection-path" stroke="#ec4899" d="M960,540 Q800,700 650,780" opacity="0.4"/>
            <!-- OOP Connection -->
            <path class="connection-path" stroke="#eab308" d="M960,540 Q1100,720 1280,800" opacity="0.4"/>
        </svg>

        <!-- Central Node -->
        <div class="center-node">
            <div class="relative">
                <div class="absolute inset-0 bg-indigo-500/20 rounded-full blur-3xl pulse-ring"></div>
                <div class="relative w-32 h-32 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center glow-purple cursor-pointer" @click="selectedTopic = null">
                    <div class="text-center">
                        <div class="text-2xl font-bold">PHP</div>
                        <div class="text-xs text-indigo-200">Fundamentals</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Topic Nodes -->
        <template x-for="(topic, index) in topics" :key="topic.id">
            <div class="topic-node" :style="`top: ${topic.y}%; left: ${topic.x}%;`" @click="selectTopic(topic)">
                <div class="relative group cursor-pointer">
                    <!-- Glow -->
                    <div class="absolute inset-0 rounded-2xl blur-xl opacity-0 group-hover:opacity-100 transition-opacity" :class="topic.glow"></div>
                    
                    <!-- Card -->
                    <div class="relative bg-card border border-border rounded-2xl p-4 w-48 hover:border-opacity-50 transition-all"
                         :class="selectedTopic?.id === topic.id ? 'ring-2 ring-opacity-50' : ''"
                         :style="selectedTopic?.id === topic.id ? `--tw-ring-color: ${topic.color}` : ''">
                        
                        <!-- Icon -->
                        <div class="w-10 h-10 rounded-xl flex items-center justify-center mb-3"
                             :style="`background: ${topic.color}20`">
                            <span class="text-xl" x-text="topic.icon"></span>
                        </div>
                        
                        <!-- Title -->
                        <h3 class="font-semibold text-white mb-1" x-text="topic.title"></h3>
                        <p class="text-xs text-gray-500" x-text="topic.subtopics.length + ' subtopics'"></p>
                        
                        <!-- Indicator -->
                        <div class="absolute -top-1 -right-1 w-3 h-3 rounded-full"
                             :style="`background: ${topic.color}`"></div>
                    </div>
                </div>
            </div>
        </template>

        <!-- Detail Panel -->
        <div class="detail-panel fixed top-20 right-0 bottom-0 w-96 bg-card border-l border-border overflow-y-auto z-40"
             :class="showPanel && selectedTopic ? 'visible-panel' : 'hidden-panel'">
            
            <template x-if="selectedTopic">
                <div class="p-6">
                    <!-- Header -->
                    <div class="flex items-start justify-between mb-6">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-xl flex items-center justify-center"
                                 :style="`background: ${selectedTopic.color}20`">
                                <span class="text-2xl" x-text="selectedTopic.icon"></span>
                            </div>
                            <div>
                                <h2 class="text-xl font-bold text-white" x-text="selectedTopic.title"></h2>
                                <p class="text-sm text-gray-500">Topic <span x-text="selectedTopic.id"></span> of 6</p>
                            </div>
                        </div>
                        <button @click="selectedTopic = null" class="text-gray-500 hover:text-white">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>

                    <!-- Description -->
                    <div class="bg-dark rounded-xl p-4 mb-6">
                        <p class="text-sm text-gray-400" x-text="selectedTopic.description"></p>
                    </div>

                    <!-- Subtopics -->
                    <div class="mb-6">
                        <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-3">Sub Topics</h3>
                        <div class="space-y-2">
                            <template x-for="(sub, i) in selectedTopic.subtopics" :key="i">
                                <div class="subtopic-pill flex items-center gap-3 bg-dark/50 rounded-lg px-3 py-2 cursor-pointer"
                                     @click="sub.expanded = !sub.expanded">
                                    <div class="w-2 h-2 rounded-full" :style="`background: ${selectedTopic.color}`"></div>
                                    <span class="text-sm text-gray-300 flex-1" x-text="sub.name"></span>
                                    <svg class="w-4 h-4 text-gray-500 transition-transform" :class="sub.expanded ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                    </svg>
                                </div>
                                <!-- Expanded Content -->
                                <div x-show="sub.expanded" x-collapse class="ml-5 pl-3 border-l border-gray-800">
                                    <p class="text-xs text-gray-500 py-2" x-text="sub.description"></p>
                                    <div class="flex flex-wrap gap-2 pb-3">
                                        <template x-for="(example, j) in sub.examples" :key="j">
                                            <span class="text-xs px-2 py-1 rounded-md bg-indigo-500/10 text-indigo-400" x-text="example"></span>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Key Points -->
                    <div class="mb-6">
                        <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-3">Key Points</h3>
                        <div class="space-y-2">
                            <template x-for="(point, i) in selectedTopic.keyPoints" :key="i">
                                <div class="flex items-start gap-2">
                                    <div class="w-1.5 h-1.5 rounded-full mt-1.5" :style="`background: ${selectedTopic.color}`"></div>
                                    <span class="text-sm text-gray-400" x-text="point"></span>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Practice -->
                    <div class="bg-gradient-to-br from-indigo-500/10 to-purple-500/10 rounded-xl p-4">
                        <h3 class="text-sm font-semibold text-white mb-2">💡 Practice Tip</h3>
                        <p class="text-xs text-gray-400" x-text="selectedTopic.practiceTip"></p>
                    </div>
                </div>
            </template>
        </div>
    </main>

    <!-- Footer Legend -->
    <footer class="fixed bottom-0 left-0 right-0 bg-dark/80 backdrop-blur-xl border-t border-border z-40">
        <div class="max-w-7xl mx-auto px-6 py-3">
            <div class="flex items-center justify-center gap-6 flex-wrap">
                <template x-for="topic in topics" :key="topic.id">
                    <div class="flex items-center gap-2 cursor-pointer hover:opacity-80 transition-opacity" @click="selectTopic(topic)">
                        <div class="w-3 h-3 rounded-full" :style="`background: ${topic.color}`"></div>
                        <span class="text-xs text-gray-500" x-text="topic.title"></span>
                    </div>
                </template>
            </div>
        </div>
    </footer>

    <script>
        function mindmap() {
            return {
                showPanel: true,
                selectedTopic: null,
                topics: [
                    {
                        id: 1,
                        title: 'Variables',
                        icon: '📦',
                        color: '#6366f1',
                        glow: 'glow-purple',
                        x: 25,
                        y: 18,
                        description: 'Variables are containers for storing data values. In PHP, a variable starts with the $ sign, followed by the name of the variable.',
                        subtopics: [
                            {
                                name: 'Declaration & Naming',
                                expanded: false,
                                description: 'Variables start with $ and can contain letters, numbers, underscores. Must start with a letter or underscore.',
                                examples: ['$name = "John"', '$age = 25', '$_private = true']
                            },
                            {
                                name: 'Variable Scope',
                                expanded: false,
                                description: 'Variables have different scopes: local, global, and static. Global variables need the global keyword inside functions.',
                                examples: ['local scope', 'global keyword', 'static keyword']
                            },
                            {
                                name: 'Superglobals',
                                expanded: false,
                                description: 'Built-in variables accessible anywhere: $_GET, $_POST, $_SESSION, $_COOKIE, $GLOBALS.',
                                examples: ['$_GET', '$_POST', '$_SESSION', '$GLOBALS']
                            },
                            {
                                name: 'Variable Variables',
                                expanded: false,
                                description: 'Use double dollar signs to use the value of a variable as the name of another variable.',
                                examples: ['$$var', 'Dynamic names']
                            },
                            {
                                name: 'References',
                                expanded: false,
                                description: 'Create aliases using & symbol. Both variables point to the same memory location.',
                                examples: ['&$a', 'Reference assignment']
                            }
                        ],
                        keyPoints: [
                            'Always start with $ sign',
                            'Case-sensitive: $name ≠ $Name',
                            'No declaration needed (dynamic typing)',
                            'Use meaningful variable names',
                            'Follow PSR naming conventions'
                        ],
                        practiceTip: 'Create a script that demonstrates variable scope, references, and superglobals. Try swapping two variables with and without references.'
                    },
                    {
                        id: 2,
                        title: 'Loops',
                        icon: '🔄',
                        color: '#22c55e',
                        glow: 'glow-green',
                        x: 68,
                        y: 15,
                        description: 'Loops are used to execute a block of code repeatedly. PHP supports several loop types for different use cases.',
                        subtopics: [
                            {
                                name: 'While Loop',
                                expanded: false,
                                description: 'Executes code as long as condition is true. Checks condition before each iteration.',
                                examples: ['while ($i < 10)', 'Pre-check loop']
                            },
                            {
                                name: 'Do-While Loop',
                                expanded: false,
                                description: 'Executes code at least once, then checks condition. Post-check loop.',
                                examples: ['do { } while ($i < 10)', 'At least once']
                            },
                            {
                                name: 'For Loop',
                                expanded: false,
                                description: 'Best for counter-based loops. Init, condition, and increment in one line.',
                                examples: ['for ($i=0; $i<10; $i++)', 'Counter-based']
                            },
                            {
                                name: 'Foreach Loop',
                                expanded: false,
                                description: 'Iterates over arrays. Two syntaxes: value only or key-value pairs.',
                                examples: ['foreach ($arr as $val)', 'foreach ($arr as $k => $v)']
                            },
                            {
                                name: 'Loop Control',
                                expanded: false,
                                description: 'break exits loop, continue skips current iteration, goto jumps to label.',
                                examples: ['break', 'continue', 'goto']
                            }
                        ],
                        keyPoints: [
                            'Use foreach for arrays',
                            'Avoid infinite loops',
                            'break exits completely',
                            'continue skips to next iteration',
                            'Nested loops should be minimized'
                        ],
                        practiceTip: 'Build a multiplication table using nested for loops. Create a star pattern generator and a number pyramid.'
                    },
                    {
                        id: 3,
                        title: 'Conditions',
                        icon: '🔀',
                        color: '#f97316',
                        glow: 'glow-orange',
                        x: 18,
                        y: 42,
                        description: 'Conditional statements execute different code based on conditions. They control the flow of your program.',
                        subtopics: [
                            {
                                name: 'If / Else',
                                expanded: false,
                                description: 'Basic conditional execution. if checks condition, else provides fallback.',
                                examples: ['if ($x > 5)', 'if-else', 'if-elseif-else']
                            },
                            {
                                name: 'Switch Statement',
                                expanded: false,
                                description: 'Compares a value against multiple cases. Uses loose comparison (==).',
                                examples: ['switch ($var)', 'case:', 'default:']
                            },
                            {
                                name: 'Match Expression',
                                expanded: false,
                                description: 'PHP 8+ feature. Uses strict comparison (===) and returns values.',
                                examples: ['match($x)', 'Strict comparison', 'Returns value']
                            },
                            {
                                name: 'Ternary Operator',
                                expanded: false,
                                description: 'Shorthand if-else. condition ? true : false',
                                examples: ['$x = ($a > $b) ? $a : $b']
                            },
                            {
                                name: 'Null Coalescing',
                                expanded: false,
                                description: 'Checks if value exists and is not null. ?? operator.',
                                examples: ['$x = $a ?? $b', 'isset() alternative']
                            }
                        ],
                        keyPoints: [
                            'match uses strict comparison (===)',
                            'switch uses loose comparison (==)',
                            'Null coalescing is null-safe',
                            'Ternary for simple conditions',
                            'Avoid deeply nested conditions'
                        ],
                        practiceTip: 'Create a grade calculator that converts numeric scores to letter grades. Build a simple calculator using switch or match.'
                    },
                    {
                        id: 4,
                        title: 'Operators',
                        icon: '⚙️',
                        color: '#06b6d4',
                        glow: 'glow-cyan',
                        x: 72,
                        y: 45,
                        description: 'Operators perform operations on variables and values. PHP has arithmetic, comparison, logical, and other operator types.',
                        subtopics: [
                            {
                                name: 'Arithmetic',
                                expanded: false,
                                description: 'Mathematical operations: +, -, *, /, % (modulus), ** (exponent)',
                                examples: ['$a + $b', '$a ** $b', '$a % $b']
                            },
                            {
                                name: 'Comparison',
                                expanded: false,
                                description: 'Compare values: == (loose), === (strict), !=, !==, <, >, <=, >=',
                                examples: ['$a == $b', '$a === $b', '$a !== $b']
                            },
                            {
                                name: 'Logical',
                                expanded: false,
                                description: 'Combine conditions: && (and), || (or), ! (not), xor',
                                examples: ['$a && $b', '$a || $b', '!$a']
                            },
                            {
                                name: 'Assignment',
                                expanded: false,
                                description: 'Assign values: =, +=, -=, *=, /=, .= (concatenation)',
                                examples: ['$a += 5', '$a .= "hi"']
                            },
                            {
                                name: 'Special Operators',
                                expanded: false,
                                description: 'Spaceship (<=>), null coalescing (??), type casting (int)',
                                examples: ['$a <=> $b', '$a ?? $b', '(string)$a']
                            }
                        ],
                        keyPoints: [
                            '=== checks type and value',
                            '== performs type juggling',
                            '<=> returns -1, 0, or 1',
                            '?? is null-coalescing',
                            '.= concatenates strings'
                        ],
                        practiceTip: 'Build a calculator that handles all arithmetic operations. Practice using comparison operators in conditional statements.'
                    },
                    {
                        id: 5,
                        title: 'Functions & Logic',
                        icon: '🎯',
                        color: '#ec4899',
                        glow: 'glow-pink',
                        x: 22,
                        y: 72,
                        description: 'Functions are reusable blocks of code. They help organize code, reduce repetition, and make programs modular.',
                        subtopics: [
                            {
                                name: 'Function Basics',
                                expanded: false,
                                description: 'Define with function keyword, parameters, return type, and body.',
                                examples: ['function add($a, $b): int', 'return statement']
                            },
                            {
                                name: 'Parameters',
                                expanded: false,
                                description: 'Required, default, named arguments, and variadic (...args).',
                                examples: ['function test($a, $b = 5)', '...$args']
                            },
                            {
                                name: 'Anonymous Functions',
                                expanded: false,
                                description: 'Closures assigned to variables. Can use use keyword to inherit variables.',
                                examples: ['$fn = function($x) {}', 'use ($var)']
                            },
                            {
                                name: 'Arrow Functions',
                                expanded: false,
                                description: 'PHP 7.4+. Short syntax with implicit return.',
                                examples: ['fn($x) => $x * 2', 'Auto return']
                            },
                            {
                                name: 'Recursion',
                                expanded: false,
                                description: 'Function calls itself. Must have base case to avoid infinite loop.',
                                examples: ['function factorial(n)', 'Base case required']
                            }
                        ],
                        keyPoints: [
                            'Use type hints for better code',
                            'Arrow functions auto-return',
                            'Closures can capture variables',
                            'Keep functions small and focused',
                            'Follow Single Responsibility Principle'
                        ],
                        practiceTip: 'Build a recursive factorial function. Create array manipulation functions using array_map and array_filter. Implement a simple calculator with functions.'
                    },
                    {
                        id: 6,
                        title: 'OOP',
                        icon: '🏗️',
                        color: '#eab308',
                        glow: 'glow-yellow',
                        x: 68,
                        y: 75,
                        description: 'Object-Oriented Programming organizes code into classes and objects. It provides encapsulation, inheritance, and polymorphism.',
                        subtopics: [
                            {
                                name: 'Class & Object',
                                expanded: false,
                                description: 'Blueprint (class) and instance (object). Properties and methods.',
                                examples: ['class User {}', '$user = new User()']
                            },
                            {
                                name: 'Access Modifiers',
                                expanded: false,
                                description: 'public (everywhere), protected (class + children), private (class only).',
                                examples: ['public $name', 'protected $age', 'private $secret']
                            },
                            {
                                name: 'Inheritance',
                                expanded: false,
                                description: 'extends keyword. Child inherits parent properties and methods.',
                                examples: ['class Child extends Parent', 'parent::__construct()']
                            },
                            {
                                name: 'Interfaces & Traits',
                                expanded: false,
                                description: 'Interfaces define contracts. Traits provide reusable code.',
                                examples: ['interface Logger', 'trait SharedCode']
                            },
                            {
                                name: 'Magic Methods',
                                expanded: false,
                                description: 'Special methods: __construct, __get, __set, __toString, __call.',
                                examples: ['__construct()', '__toString()', '__call()']
                            }
                        ],
                        keyPoints: [
                            'Encapsulation hides internal details',
                            'Inheritance promotes code reuse',
                            'Interfaces ensure consistency',
                            'Traits solve single inheritance issue',
                            'Magic methods handle special behavior'
                        ],
                        practiceTip: 'Create a User class with inheritance. Build an interface for payment methods. Implement magic methods for a custom object.'
                    }
                ],
                selectTopic(topic) {
                    this.selectedTopic = this.selectedTopic?.id === topic.id ? null : topic;
                    this.showPanel = true;
                },
                resetView() {
                    this.selectedTopic = null;
                    this.showPanel = false;
                }
            }
        }
    </script>
</body>
</html>
